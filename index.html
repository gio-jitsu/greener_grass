<script>
const ITEMS = [{"title":"Proposta grafica homepage","html":"\u003c!doctype html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pitcha l'Amico – Proposta grafica homepage\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Lilita+One&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --coral:#FF5A5F; --red:#E81F32; --cream:#FCEFB4; --paper:#FFF8EA; --ink:#1B1212; --amber:#F99C00;\n  --r:22px;\n}\n*{box-sizing:border-box;margin:0}\nbody{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;overflow-x:hidden}\nh1,h2,h3,.disp{font-family:'Lilita One',sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:1.02}\na{color:inherit;text-decoration:none}\n.wrap{max-width:1120px;margin:0 auto;padding:0 20px}\n.note{background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:8px 16px}\n\n/* nav */\nnav{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:2px solid var(--ink)}\nnav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}\n.logo{display:inline-flex;flex-direction:column;transform:rotate(-2deg)}\n.logo b{font-family:'Lilita One';font-weight:400;font-size:17px;padding:2px 10px;line-height:1.1;text-transform:uppercase}\n.logo b:first-child{background:var(--cream);color:var(--red);border-radius:8px 8px 0 0}\n.logo b:last-child{background:var(--red);color:var(--cream);border-radius:0 0 8px 8px}\n.menu{display:flex;gap:26px;font-weight:700;font-size:15px;align-items:center}\n.menu a:hover{color:var(--red)}\n.btn{display:inline-block;font-family:'Lilita One';text-transform:uppercase;letter-spacing:.02em;font-size:17px;padding:13px 26px;border-radius:999px;border:2px solid var(--ink);background:var(--red);color:var(--cream);box-shadow:4px 4px 0 var(--ink);transition:.15s}\n.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}\n.btn.alt{background:var(--cream);color:var(--red)}\n.btn.sm{font-size:14px;padding:9px 18px;box-shadow:3px 3px 0 var(--ink)}\n\n/* hero */\n.hero{background:var(--coral);border-bottom:2px solid var(--ink);padding:72px 0 88px;position:relative;overflow:hidden}\n.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}\n.hero h1{font-size:clamp(46px,7.4vw,92px);color:var(--cream);text-shadow:4px 4px 0 var(--red)}\n.hero p{font-size:19px;margin:22px 0 32px;max-width:480px;color:#fff;font-weight:500}\n.hero .ctas{display:flex;gap:14px;flex-wrap:wrap}\n.stage{position:relative;height:380px}\n.card{position:absolute;border:2px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--ink);padding:22px}\n.c1{background:var(--cream);width:78%;left:0;top:10px;transform:rotate(-4deg)}\n.c1 small{font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.08em;font-size:12px}\n.c1 .disp{font-size:32px;color:var(--red);margin:6px 0 8px}\n.c2{background:var(--red);color:var(--cream);width:62%;right:0;bottom:30px;transform:rotate(3deg)}\n.c2 .disp{font-size:56px}\n.c3{background:#fff;width:46%;left:8%;bottom:0;transform:rotate(-1.5deg);padding:14px 18px;font-weight:700}\n.sticker{position:absolute;right:6%;top:0;width:96px;height:96px;border-radius:50%;background:var(--amber);border:2px solid var(--ink);display:grid;place-items:center;text-align:center;font-family:'Lilita One';text-transform:uppercase;line-height:1;transform:rotate(12deg);font-size:15px}\n\n/* marquee */\n.strip{background:var(--ink);color:var(--cream);overflow:hidden;white-space:nowrap;padding:14px 0;font-family:'Lilita One';text-transform:uppercase;font-size:22px}\n.strip span{display:inline-block;padding-right:40px;animation:m 22s linear infinite}\n@keyframes m{to{transform:translateX(-100%)}}\n\nsection{padding:84px 0}\n.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--red);margin-bottom:10px}\nh2{font-size:clamp(34px,5vw,56px);color:var(--ink);margin-bottom:14px}\n.lead{font-size:18px;max-width:620px;margin-bottom:40px}\n\n/* events */\n.ev{display:grid;grid-template-columns:90px 1fr auto;gap:22px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:18px 22px;margin-bottom:16px;box-shadow:5px 5px 0 var(--ink)}\n.date{background:var(--cream);border:2px solid var(--ink);border-radius:16px;text-align:center;padding:8px 0}\n.date b{display:block;font-family:'Lilita One';font-weight:400;font-size:34px;color:var(--red);line-height:1}\n.date span{font-size:12px;font-weight:700;text-transform:uppercase}\n.ev h3{font-size:26px}\n.ev p{font-size:14px;opacity:.75}\n.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--amber);border:1.5px solid var(--ink);margin-bottom:6px}\n.tag.sold{background:#ddd}\n\n/* steps */\n.steps{background:var(--cream);border-block:2px solid var(--ink)}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}\n.step{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:28px;box-shadow:5px 5px 0 var(--ink)}\n.step .n{width:54px;height:54px;border-radius:50%;background:var(--red);color:var(--cream);display:grid;place-items:center;font-family:'Lilita One';font-size:26px;border:2px solid var(--ink);margin-bottom:16px}\n.step h3{font-size:26px;margin-bottom:8px}\n.step:nth-child(2){transform:rotate(1deg)} .step:nth-child(1){transform:rotate(-1deg)} .step:nth-child(3){transform:rotate(-.6deg)}\n\n/* for whom */\n.who{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.pill{border:2px solid var(--ink);border-radius:var(--r);padding:22px;font-weight:500}\n.pill b{display:block;font-family:'Lilita One';font-weight:400;font-size:24px;text-transform:uppercase;margin-bottom:6px}\n.pill:nth-child(1){background:var(--coral);color:#fff}\n.pill:nth-child(2){background:var(--cream)}\n.pill:nth-child(3){background:#fff}\n\n/* apply */\n.apply{background:var(--red);color:var(--cream);border-block:2px solid var(--ink)}\n.apply .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}\n.apply h2{color:var(--cream)}\n.apply .eyebrow{color:var(--cream);opacity:.85}\nform{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r);padding:26px;box-shadow:6px 6px 0 var(--ink);display:grid;gap:14px}\nlabel{font-size:13px;font-weight:700;display:grid;gap:5px}\ninput,textarea{font:inherit;padding:11px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff}\ntextarea{min-height:84px;resize:vertical}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.check{font-weight:500;font-size:12px;display:flex;gap:8px;align-items:flex-start}\n\n/* press */\n.press{display:flex;flex-wrap:wrap;gap:14px 38px;align-items:center;font-family:'Lilita One';font-size:24px;text-transform:uppercase;opacity:.6}\n\n/* faq */\ndetails{background:#fff;border:2px solid var(--ink);border-radius:18px;margin-bottom:12px;padding:16px 22px}\nsummary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between}\nsummary::after{content:\"+\";font-family:'Lilita One';font-size:24px;color:var(--red)}\ndetails[open] summary::after{content:\"–\"}\ndetails p{margin-top:10px}\n\nfooter{background:var(--ink);color:var(--cream);padding:46px 0;font-size:14px}\nfooter .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}\nfooter a{opacity:.8;margin-right:18px}\n\n/* palette */\n.spec{background:#fff;border-top:2px solid var(--ink)}\n.sw{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 30px}\n.sw div{width:120px;border:2px solid var(--ink);border-radius:16px;overflow:hidden;font-size:12px;font-weight:700}\n.sw i{display:block;height:62px}\n.sw span{display:block;padding:6px 10px}\n.sample{display:flex;gap:30px;flex-wrap:wrap;align-items:baseline}\n\n@media(max-width:860px){\n  .menu a:not(.btn){display:none}\n  .hero .wrap,.apply .wrap{grid-template-columns:1fr}\n  .stage{height:330px}\n  .grid3,.who{grid-template-columns:1fr}\n  .ev{grid-template-columns:70px 1fr}\n  .ev .btn{grid-column:1/-1;text-align:center}\n  .two{grid-template-columns:1fr}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"note\">Mockup di proposta grafica – testi ed eventi sono segnaposto\u003c/div>\n\n\u003cnav>\u003cdiv class=\"wrap\">\n  \u003ca class=\"logo\" href=\"#\">\u003cb>Pitcha\u003c/b>\u003cb>l'Amico\u003c/b>\u003c/a>\n  \u003cdiv class=\"menu\">\n    \u003ca href=\"#format\">Format\u003c/a>\u003ca href=\"#eventi\">Eventi\u003c/a>\u003ca href=\"#candidati\">Candidati\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\n    \u003ca class=\"btn sm\" href=\"#eventi\">Biglietti\u003c/a>\n  \u003c/div>\n\u003c/div>\u003c/nav>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n  \u003cdiv>\n    \u003ch1>Pitcha il tuo amico single.\u003c/h1>\n    \u003cp>Cinque minuti sul palco, un amico che parla bene di te (o tu di lui) e una sala piena di persone da conoscere. Dal vivo, senza app.\u003c/p>\n    \u003cdiv class=\"ctas\">\u003ca class=\"btn alt\" href=\"#eventi\">Scopri gli eventi\u003c/a>\u003ca class=\"btn\" href=\"#candidati\">Presenta un amico\u003c/a>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"stage\" aria-hidden=\"true\">\n    \u003cdiv class=\"sticker\">Dal\u003cbr>vivo!\u003c/div>\n    \u003cdiv class=\"card c1\">\u003csmall>Il pitch\u003c/small>\u003cdiv class=\"disp\">\"È il migliore a fare la carbonara.\"\u003c/div>\u003cspan>— Giulia, sul palco per Marco\u003c/span>\u003c/div>\n    \u003cdiv class=\"card c2\">\u003cdiv class=\"disp\">5 min\u003c/div>per convincere la sala\u003c/div>\n    \u003cdiv class=\"card c3\">25–40 anni · tutti benvenuti\u003c/div>\n  \u003c/div>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"strip\">\u003cspan>Pitcha il tuo amico ★ Conosci persone vere ★ Serate dal vivo ★ Pitcha il tuo amico ★ Conosci persone vere ★ Serate dal vivo ★ Pitcha il tuo amico ★ Conosci persone vere ★ Serate dal vivo ★\u003c/span>\u003c/div>\n\n\u003csection id=\"eventi\">\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"eyebrow\">Prossime date\u003c/div>\n  \u003ch2>Trova la tua serata\u003c/h2>\n  \u003cp class=\"lead\">Scegli città e data, acquista il biglietto in pochi click e ricevi il QR code via email.\u003c/p>\n  \u003cdiv class=\"ev\">\u003cdiv class=\"date\">\u003cb>21\u003c/b>\u003cspan>Nov\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"tag\">Ultimi posti\u003c/span>\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · ore 20:30 · Locale da definire\u003c/p>\u003c/div>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n  \u003cdiv class=\"ev\">\u003cdiv class=\"date\">\u003cb>05\u003c/b>\u003cspan>Dic\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"tag\" style=\"background:var(--cream)\">Disponibile\u003c/span>\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · ore 20:30 · Locale da definire\u003c/p>\u003c/div>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n  \u003cdiv class=\"ev\">\u003cdiv class=\"date\">\u003cb>18\u003c/b>\u003cspan>Gen\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"tag sold\">Sold out\u003c/span>\u003ch3>Roma\u003c/h3>\u003cp>Sabato · ore 21:00 · Lista d'attesa aperta\u003c/p>\u003c/div>\u003ca class=\"btn sm alt\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"steps\" id=\"format\">\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"eyebrow\">Il format\u003c/div>\n  \u003ch2>Come funziona\u003c/h2>\n  \u003cp class=\"lead\">Tre passi, zero imbarazzo. Il resto lo fa la serata.\u003c/p>\n  \u003cdiv class=\"grid3\">\n    \u003cdiv class=\"step\">\u003cdiv class=\"n\">1\u003c/div>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la data nella tua città e prendi il biglietto. Più biglietti in un'unica transazione, se vieni in compagnia.\u003c/p>\u003c/div>\n    \u003cdiv class=\"step\">\u003cdiv class=\"n\">2\u003c/div>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti pitchare. Cinque minuti, anche con un PDF di slide divertenti.\u003c/p>\u003c/div>\n    \u003cdiv class=\"step\">\u003cdiv class=\"n\">3\u003c/div>\u003ch3>Conosci persone\u003c/h3>\u003cp>Dopo i pitch si chiacchiera, si brinda e le connessioni continuano anche dopo la serata.\u003c/p>\u003c/div>\n  \u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"eyebrow\">Per chi è\u003c/div>\n  \u003ch2>Un posto dove stare bene\u003c/h2>\n  \u003cp class=\"lead\">Un ambiente informale, pensato per tutte e tutti.\u003c/p>\n  \u003cdiv class=\"who\">\n    \u003cdiv class=\"pill\">\u003cb>Single 25–40\u003c/b>Vuoi conoscere gente nuova senza passare dalle app.\u003c/div>\n    \u003cdiv class=\"pill\">\u003cb>Amici di single\u003c/b>Hai un amico fantastico e vuoi raccontarlo al mondo.\u003c/div>\n    \u003cdiv class=\"pill\">\u003cb>Inclusivo\u003c/b>Spazio sicuro per introversi e per la comunità LGBTQ+.\u003c/div>\n  \u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"apply\" id=\"candidati\">\u003cdiv class=\"wrap\">\n  \u003cdiv>\n    \u003cdiv class=\"eyebrow\">Candidature\u003c/div>\n    \u003ch2>Hai un amico single da presentare?\u003c/h2>\n    \u003cp class=\"lead\" style=\"margin:0\">Compila il modulo: ti ricontattiamo per fissare la data e preparare il pitch insieme.\u003c/p>\n  \u003c/div>\n  \u003cform onsubmit=\"return false\">\n    \u003cdiv class=\"two\">\u003clabel>Il tuo nome\u003cinput placeholder=\"Giulia\">\u003c/label>\u003clabel>Email\u003cinput placeholder=\"giulia@email.it\">\u003c/label>\u003c/div>\n    \u003clabel>Nome del tuo amico\u003cinput placeholder=\"Marco\">\u003c/label>\n    \u003clabel>Perché dovremmo conoscerlo?\u003ctextarea placeholder=\"Racconta in poche righe…\">\u003c/textarea>\u003c/label>\n    \u003clabel class=\"check\">\u003cinput type=\"checkbox\" style=\"margin-top:2px\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\n    \u003cbutton class=\"btn\" style=\"cursor:pointer;font-size:18px\">Invia candidatura\u003c/button>\n  \u003c/form>\n\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"eyebrow\">Dicono di noi\u003c/div>\n  \u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection style=\"padding-top:0\" id=\"faq\">\u003cdiv class=\"wrap\" style=\"max-width:780px\">\n  \u003cdiv class=\"eyebrow\">FAQ\u003c/div>\n  \u003ch2>Domande frequenti\u003c/h2>\u003cbr>\n  \u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire da solo. Se vuoi essere presentato, ti aiutiamo a trovare il formato giusto.\u003c/p>\u003c/details>\n  \u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual: vieni comodo, ma con la maglia bella.\u003c/p>\u003c/details>\n  \u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n  \u003cdetails>\u003csummary>Posso comprare più biglietti insieme?\u003c/summary>\u003cp>Sì, in un'unica transazione: ogni biglietto ha il suo QR code.\u003c/p>\u003c/details>\n\u003c/div>\u003c/section>\n\n\u003cfooter>\u003cdiv class=\"wrap\">\n  \u003cdiv>\u003cdiv class=\"logo\" style=\"display:inline-flex;margin-bottom:12px\">\u003cb>Pitcha\u003c/b>\u003cb>l'Amico\u003c/b>\u003c/div>\u003cbr>© Pitcha l'Amico\u003c/div>\n  \u003cdiv>\u003ca href=\"#\">Termini\u003c/a>\u003ca href=\"#\">Privacy\u003c/a>\u003ca href=\"#\">Cookie\u003c/a>\u003ca href=\"#\">Contatti\u003c/a>\u003c/div>\n\u003c/div>\u003c/footer>\n\n\u003csection class=\"spec\">\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"eyebrow\">Linee guida della proposta\u003c/div>\n  \u003ch2>Palette e tipografia\u003c/h2>\n  \u003cdiv class=\"sw\">\n    \u003cdiv>\u003ci style=\"background:#FF5A5F\">\u003c/i>\u003cspan>Corallo\u003cbr>#FF5A5F\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"background:#E81F32\">\u003c/i>\u003cspan>Rosso\u003cbr>#E81F32\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"background:#FCEFB4\">\u003c/i>\u003cspan>Crema\u003cbr>#FCEFB4\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"background:#FFF8EA\">\u003c/i>\u003cspan>Carta\u003cbr>#FFF8EA\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"background:#F99C00\">\u003c/i>\u003cspan>Ambra\u003cbr>#F99C00\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"background:#1B1212\">\u003c/i>\u003cspan style=\"color:#1B1212\">Inchiostro\u003cbr>#1B1212\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sample\">\u003cspan class=\"disp\" style=\"font-size:44px;color:var(--red)\">Lilita One – titoli\u003c/span>\u003cspan style=\"font-size:20px\">DM Sans – testi e interfaccia\u003c/span>\u003c/div>\n  \u003cp style=\"margin-top:20px;max-width:640px\">Colori ereditati dal logo attuale; font da verificare con il materiale originale. Stile: bordi netti, ombre piene, carte leggermente ruotate per un tono giocoso ma ordinato.\u003c/p>\n\u003c/div>\u003c/section>\n\u003c/body>\n\u003c/html>\n"},{"title":"Proposta 2 Notturna","html":"\u003c!doctype html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pitcha l'Amico – Proposta 2 Notturna\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#0E0A1C;--bg2:#17102B;--line:rgba(255,255,255,.12);--txt:#EDE6F5 y-content:center;flex-wrap:wrap}\n.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s infinite alternate}\n@keyframes tw{to{opacity:.1}}\n\nsection{padding:110px 0}\n.eyebrow{letter-spacing:.28em;font-size:12px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}\nh2{font-size:clamp(36px,5vw,62px);margin-bottom:18px}\n.lead{color:var(--mute);max-width:560px;font-size:17px}\n\n.events{margin-top:50px;border-top:1px solid var(--line)}\n.ev{display:grid;grid-template-columns:130px 1fr auto;gap:30px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line);transition:.25s}\n.ev:hover{padding-left:16px;background:linear-gradient(90deg,rgba(232,31,50,.12),transparent)}\n.ev .d{font-family:'Fraunces';font-size:44px;line-height:1}\n.ev .d small{display:block;font-family:'Manrope';font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:4px}\n.ev h3{font-size:30px;font-style:italic}\n.ev p{color:var(--mute);font-size:14px}\n.st{font-size:12px;color:var(--glow);letter-spacing:.1em;text-transform:uppercase}\n\n.format{background:var(--bg2)}\n.tl{margin-top:56px;display:grid;gap:0;position:relative}\n.tl::before{content:\"\";position:absolute;left:31px;top:10px;bottom:10px;width:1px;background:linear-gradient(var(--glow),transparent)}\n.row{display:grid;grid-template-columns:64px 1fr;gap:28px;padding:26px 0}\n.row .n{width:64px;height:64px;border-radius:50%;border:1px solid var(--glow);display:grid;place-items:center;font-family:'Fraunces';font-size:26px;font-style:italic;background:var(--bg2);box-shadow:0 0 24px rgba(255,90,110,.35);position:relative}\n.row h3{font-size:32px;margin-bottom:6px}\n.row p{color:var(--mute);max-width:560px}\n\n.who{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}\n.glass{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:22px;padding:32px;backdrop-filter:blur(8px)}\n.glass h3{font-size:26px;font-style:italic;margin-bottom:8px}\n.glass p{color:var(--mute);font-size:15px}\n\n.apply{background:radial-gradient(ellipse at 20% 50%,rgba(232,31,50,.3),transparent 55%),var(--bg2)}\n.apply .wrap{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}\nform{display:grid;gap:14px}\ninput,textarea{font:inherit;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}\ninput::placeholder,textarea::placeholder{color:#7d7396}\ntextarea{min-height:92px}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.chk{font-size:12px;color:var(--mute);display:flex;gap:8px}\n.chk input{width:auto}\n\n.press{display:flex;flex-wrap:wrap;gap:12px 44px;font-family:'Fraunces';font-style:italic;font-size:24px;color:var(--mute);margin-top:26px}\ndetails{border-bottom:1px solid var(--line);padding:22px 0}\nsummary{cursor:pointer;font-family:'Fraunces';font-size:23px;list-style:none;display:flex;justify-content:space-between}\nsummary::after{content:\"+\";color:var(--glow)}\ndetails[open] summary::after{content:\"–\"}\ndetails p{color:var(--mute);margin-top:10px;max-width:640px}\nfooter{border-top:1px solid var(--line);padding:50px 0;color:var(--mute);font-size:14px}\nfooter .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}\nfooter a{margin-left:20px}\n.spec{background:#080613;padding:60px 0}\n.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.sw div{width:104px;font-size:11px;color:var(--mute)}.sw i{display:block;height:54px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px}\n\n@media(max-width:820px){.menu a:not(.btn){display:none}.apply .wrap,.who{grid-template-columns:1fr}.ev{grid-template-columns:90px 1fr}.ev .btn{grid-column:1/-1;text-align:center}.two{grid-template-columns:1fr}section{padding:76px 0}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cspan class=\"badge\">Proposta 2 – Notturna e romantica · testi ed eventi segnaposto\u003c/span>\n\u003cdiv style=\"position:relative\">\n\u003cnav>\u003cdiv class=\"wrap\">\u003ca class=\"logo\" href=\"#\">Pitcha \u003cb>l'Amico\u003c/b>\u003c/a>\n\u003cdiv class=\"menu\">\u003ca href=\"#format\">Format\u003c/a>\u003ca href=\"#eventi\">Eventi\u003c/a>\u003ca href=\"#candidati\">Candidati\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca class=\"btn sm\" href=\"#eventi\">Biglietti\u003c/a>\u003c/div>\u003c/div>\u003c/nav>\n\u003cheader class=\"hero\">\n\u003cdiv class=\"stars\">\u003ci style=\"left:12%;top:22%\">\u003c/i>\u003ci style=\"left:80%;top:18%;animation-delay:1s\">\u003c/i>\u003ci style=\"left:30%;top:60%;animation-delay:2s\">\u003c/i>\u003ci style=\"left:66%;top:74%\">\u003c/i>\u003ci style=\"left:90%;top:50%;animation-delay:1.5s\">\u003c/i>\u003ci style=\"left:5%;top:70%;animation-delay:.5s\">\u003c/i>\u003c/div>\n\u003cdiv class=\"wrap\">\n\u003cdiv class=\"eyebrow\">Serate dal vivo · Single · Amici\u003c/div>\n\u003ch1>Pitcha il tuo amico \u003cem>single.\u003c/em>\u003c/h1>\n\u003cp>Cinque minuti sul palco, una sala che ascolta e una serata in cui conoscere persone vere, lontano dallo schermo.\u003c/p>\n\u003cdiv class=\"ctas\">\u003ca class=\"btn\" href=\"#eventi\">Scopri gli eventi\u003c/a>\u003ca class=\"btn ghost\" href=\"#candidati\">Presenta un amico\u003c/a>\u003c/div>\n\u003c/div>\u003c/header>\u003c/div>\n\n\u003csection id=\"eventi\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"eyebrow\">Prossime date\u003c/div>\u003ch2>Una sera, \u003cem>una città.\u003c/em>\u003c/h2>\n\u003cp class=\"lead\">Scegli la data, acquista il biglietto e ricevi il tuo QR code via email.\u003c/p>\n\u003cdiv class=\"events\">\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">21\u003csmall>Novembre\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003c/div>\u003cdiv>\u003cspan class=\"st\">Ultimi posti\u003c/span>&nbsp; \u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">05\u003csmall>Dicembre\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003c/div>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">18\u003csmall>Gennaio\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Roma\u003c/h3>\u003cp>Sabato · 21:00 · Lista d'attesa aperta\u003c/p>\u003c/div>\u003ca class=\"btn sm ghost\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"format\" id=\"format\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"eyebrow\">Il format\u003c/div>\u003ch2>Come \u003cem>funziona\u003c/em>\u003c/h2>\n\u003cdiv class=\"tl\">\n\u003cdiv class=\"row\">\u003cdiv class=\"n\">1\u003c/div>\u003cdiv>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la serata nella tua città e prendi il biglietto, anche più di uno in un'unica transazione.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cdiv class=\"n\">2\u003c/div>\u003cdiv>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti presentare: cinque minuti, a voce, con un PDF se ti va.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cdiv class=\"n\">3\u003c/div>\u003cdiv>\u003ch3>Conosci le persone\u003c/h3>\u003cp>Dopo i pitch si chiacchiera e si brinda. Le connessioni continuano anche dopo la serata.\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\n\u003cdiv class=\"eyebrow\">Per chi è\u003c/div>\u003ch2>Un posto dove \u003cem>stare bene\u003c/em>\u003c/h2>\n\u003cdiv class=\"who\">\n\u003cdiv class=\"glass\">\u003ch3>Single 25–40\u003c/h3>\u003cp>Vuoi conoscere gente nuova senza passare dalle app.\u003c/p>\u003c/div>\n\u003cdiv class=\"glass\">\u003ch3>Amici di single\u003c/h3>\u003cp>Hai un amico fantastico e vuoi raccontarlo davanti a tutti.\u003c/p>\u003c/div>\n\u003cdiv class=\"glass\">\u003ch3>Spazio inclusivo\u003c/h3>\u003cp>Pensato per gli introversi e per la comunità LGBTQ+.\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"apply\" id=\"candidati\">\u003cdiv class=\"wrap\">\n\u003cdiv>\u003cdiv class=\"eyebrow\">Candidature\u003c/div>\u003ch2>Hai un amico \u003cem>da presentare?\u003c/em>\u003c/h2>\u003cp class=\"lead\">Raccontaci chi è. Ti ricontattiamo per scegliere la data e preparare il pitch insieme.\u003c/p>\u003c/div>\n\u003cform onsubmit=\"return false\">\u003cdiv class=\"two\">\u003cinput placeholder=\"Il tuo nome\">\u003cinput placeholder=\"Email\">\u003c/div>\u003cinput placeholder=\"Nome del tuo amico\">\u003ctextarea placeholder=\"Perché dovremmo conoscerlo?\">\u003c/textarea>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\u003cbutton class=\"btn\" style=\"border:0;cursor:pointer\">Invia candidatura\u003c/button>\u003c/form>\n\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\n\u003cdiv class=\"eyebrow\">Dicono di noi\u003c/div>\u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection style=\"padding-top:0\" id=\"faq\">\u003cdiv class=\"wrap\" style=\"max-width:780px\">\u003cdiv class=\"eyebrow\">FAQ\u003c/div>\u003ch2>Domande \u003cem>frequenti\u003c/em>\u003c/h2>\u003cbr>\n\u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire anche da solo.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Posso acquistare più biglietti insieme?\u003c/summary>\u003cp>Sì, ognuno con il proprio QR code.\u003c/p>\u003c/details>\n\u003c/div>\u003c/section>\n\n\u003cfooter>\u003cdiv class=\"wrap\">\u003cdiv class=\"logo\">Pitcha \u003cb>l'Amico\u003c/b>\u003c/div>\u003cdiv>\u003ca href=\"#\">Termini\u003c/a>\u003ca href=\"#\">Privacy\u003c/a>\u003ca href=\"#\">Cookie\u003c/a>\u003ca href=\"#\">Contatti\u003c/a>\u003c/div>\u003c/div>\u003c/footer>\n\u003cdiv class=\"spec\">\u003cdiv class=\"wrap\">\u003cdiv class=\"eyebrow\">Palette e tipografia\u003c/div>\n\u003cp class=\"serif\" style=\"font-size:30px;font-style:italic\">Fraunces \u003cspan style=\"color:var(--mute);font-style:normal;font-family:Manrope;font-size:16px\">per i titoli · Manrope per i testi\u003c/span>\u003c/p>\n\u003cdiv class=\"sw\">\u003cdiv>\u003ci style=\"background:#0E0A1C\">\u003c/i>Notte #0E0A1C\u003c/div>\u003cdiv>\u003ci style=\"background:#17102B\">\u003c/i>Viola #17102B\u003c/div>\u003cdiv>\u003ci style=\"background:#E81F32\">\u003c/i>Rosso brand #E81F32\u003c/div>\u003cdiv>\u003ci style=\"background:#FF5A6E\">\u003c/i>Bagliore #FF5A6E\u003c/div>\u003cdiv>\u003ci style=\"background:#F5C97A\">\u003c/i>Oro #F5C97A\u003c/div>\u003cdiv>\u003ci style=\"background:#EDE6F5\">\u003c/i>Testo #EDE6F5\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003c/body>\u003c/html>\n"},{"title":"Proposta 3 Editoriale","html":"\u003c!doctype html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pitcha l'Amico – Proposta 3 Editoriale\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#FAF8F4;--ink:#141414;--mute:#6b6760;--line:#141414;--red:#E81F32}\n*{box-sizing:border-box;margin:0}\nbody{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;font-size:16px}\na{color:inherit;text-decoration:none}\n.wrap{max-width:1180px;margin:0 auto;padding:0 28px}\nh1,h2,h3{font-family:'Instrument Serif',serif;font-weight:400;line-height:.98;letter-spacing:-.01em}\nh1 em,h2 em,h3 em{font-style:italic;color:var(--red)}\n.top{border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:9px 0}\n.top .wrap{display:flex;justify-content:space-between}\nnav{border-bottom:1px solid var(--line)}\nnav .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:74px}\n.logo{font-family:'Instrument Serif';font-size:30px;text-align:center;font-style:italic}\n.menu{display:flex;gap:26px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}\n.menu.r{justify-content:flex-end}\n.menu a:hover,.link:hover{color:var(--red)}\n.link{border-bottom:1px solid currentColor;padding-bottom:2px;font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase}\n.btn{display:inline-block;background:var(--ink);color:var(--bg);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:16px 30px;transition:.2s}\n.btn:hover{background:var(--red)}\n\n.hero{padding:70px 0 0;border-bottom:1px solid var(--line)}\n.hero .kick{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:26px}\n.hero h1{font-size:clamp(64px,13vw,190px);max-width:1100px}\n.hero .grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin:50px 0 0;padding:34px 0 60px;border-top:1px solid var(--line);align-items:end}\n.hero p{font-family:'Instrument Serif';font-size:28px;line-height:1.25;max-width:520px}\n.hero .ctas{display:flex;gap:30px;align-items:center;justify-content:flex-end}\n.frame{height:300px;background:repeating-linear-gradient(45deg,#e9e5dc 0 10px,#f2efe8 10px 20px);display:grid;place-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-top:1px solid var(--line)}\n\nsection{padding:100px 0;border-bottom:1px solid var(--line)}\n.sh{display:grid;grid-template-columns:240px 1fr;gap:40px;margin-bottom:56px}\n.sh .no{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding-top:12px}\nh2{font-size:clamp(46px,7vw,96px)}\n.lead{font-family:'Instrument Serif';font-size:26px;max-width:620px;margin-top:20px;line-height:1.25;color:#3a3732}\n\n.ev{display:grid;grid-template-columns:240px 1fr 220px 150px;gap:30px;align-items:baseline;padding:28px 0;border-top:1px solid var(--line)}\n.ev:last-child{border-bottom:1px solid var(--line)}\n.ev .d{font-family:'Instrument Serif';font-size:56px;line-height:1}\n.ev .d small{font-family:'Inter';font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}\n.ev h3{font-size:44px}\n.ev p{font-size:14px;color:var(--mute)}\n.ev .s{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}\n.ev .link{justify-self:end}\n\n.cols{display:grid;grid-template-columns:repeat(3,1fr)}\n.col{padding:0 34px;border-left:1px solid var(--line)}\n.col:first-child{padding-left:0;border-left:0}\n.col .n{font-family:'Instrument Serif';font-size:100px;line-height:1;color:var(--red);font-style:italic}\n.col h3{font-size:38px;margin:10px 0 14px}\n.col p{color:#3a3732;font-size:15px}\n\n.who{columns:2;column-gap:60px;font-family:'Instrument Serif';font-size:30px;line-height:1.25}\n.who p{margin-bottom:24px;break-inside:avoid}\n.who b{font-weight:400;font-style:italic;color:var(--red)}\n\n.apply{background:var(--ink);color:var(--bg);border-bottom:0}\n.apply .sh .no{color:#9a968c}\n.apply h2 em{color:#ff6070}\n.apply .lead{color:#cfcabf}\n.apply .wrap>.fg{display:grid;grid-template-columns:1fr 1fr;gap:70px}\nform{display:grid;gap:20px}\ninput,textarea{font:inherit;color:var(--bg);background:transparent;border:0;border-bottom:1px solid #6b6760;padding:12px 0;width:100%;outline:0}\ninput:focus,textarea:focus{border-color:#ff6070}\ninput::placeholder,textarea::placeholder{color:#8d897f}\ntextarea{min-height:80px}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}\n.chk{font-size:12px;color:#9a968c;display:flex;gap:8px}.chk input{width:auto}\n.apply .btn{background:var(--bg);color:var(--ink);border:0;cursor:pointer;justify-self:start}\n.apply .btn:hover{background:#ff6070;color:#fff}\n\n.press{display:flex;flex-wrap:wrap;gap:10px 50px;font-family:'Instrument Serif';font-size:38px;font-style:italic}\n.press span{color:var(--mute)}\ndetails{border-top:1px solid var(--line);padding:24px 0}\ndetails:last-of-type{border-bottom:1px solid var(--line)}\nsummary{cursor:pointer;font-family:'Instrument Serif';font-size:34px;list-style:none;display:flex;justify-content:space-between}\nsummary::after{content:\"+\";color:var(--red)}details[open] summary::after{content:\"–\"}\ndetails p{margin-top:12px;max-width:620px;color:#3a3732}\nfooter{padding:40px 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase}\nfooter .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}\nfooter a{margin-left:22px}\n.spec{border-top:1px solid var(--line);padding:56px 0;background:#fff}\n.sw{display:flex;gap:0;margin-top:20px;border:1px solid var(--line);width:fit-content;flex-wrap:wrap}\n.sw div{width:130px;font-size:11px;letter-spacing:.06em;padding:0 0 8px;border-right:1px solid var(--line)}\n.sw i{display:block;height:60px;margin-bottom:8px}.sw span{padding:0 10px;display:block}\n\n@media(max-width:860px){.menu:not(.r) a,.menu.r a:not(.btn){display:none}nav .wrap{grid-template-columns:1fr auto}\n .sh{grid-template-columns:1fr;gap:8px}.hero .grid,.apply .wrap>.fg,.cols{grid-template-columns:1fr}.cols .col{border:0;padding:0 0 40px}\n .ev{grid-template-columns:1fr;gap:6px}.ev .link{justify-self:start}.who{columns:1}.two{grid-template-columns:1fr}.hero .ctas{justify-content:flex-start}section{padding:64px 0}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"top\">\u003cdiv class=\"wrap\">\u003cspan>Proposta 3 – Editoriale minimal\u003c/span>\u003cspan>Testi ed eventi segnaposto\u003c/span>\u003c/div>\u003c/div>\n\u003cnav>\u003cdiv class=\"wrap\">\n\u003cdiv class=\"menu\">\u003ca href=\"#format\">Format\u003c/a>\u003ca href=\"#eventi\">Eventi\u003c/a>\u003c/div>\n\u003ca class=\"logo\" href=\"#\">Pitcha l'Amico\u003c/a>\n\u003cdiv class=\"menu r\">\u003ca href=\"#candidati\">Candidati\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003c/div>\u003c/div>\u003c/nav>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"kick\">Serate dal vivo · Milano, Torino, Roma\u003c/div>\n\u003ch1>Pitcha il tuo amico \u003cem>single.\u003c/em>\u003c/h1>\n\u003cdiv class=\"grid\">\u003cp>Cinque minuti sul palco, una sala che ascolta. Un modo semplice e umano di conoscersi, senza app.\u003c/p>\n\u003cdiv class=\"ctas\">\u003ca class=\"btn\" href=\"#eventi\">Scopri gli eventi\u003c/a>\u003ca class=\"link\" href=\"#candidati\">Presenta un amico\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"frame\">Spazio per fotografia di una serata, a tutta larghezza\u003c/div>\u003c/header>\n\n\u003csection id=\"eventi\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"sh\">\u003cdiv class=\"no\">01 — Eventi\u003c/div>\u003cdiv>\u003ch2>Prossime \u003cem>date\u003c/em>\u003c/h2>\u003cp class=\"lead\">Scegli la città, acquista il biglietto, ricevi il QR code via email.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">21\u003csmall>Nov\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003c/div>\u003cspan class=\"s\">Ultimi posti\u003c/span>\u003ca class=\"link\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">05\u003csmall>Dic\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003c/div>\u003cspan class=\"s\" style=\"color:var(--mute)\">Disponibile\u003c/span>\u003ca class=\"link\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">18\u003csmall>Gen\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Roma\u003c/h3>\u003cp>Sabato · 21:00 · Lista d'attesa aperta\u003c/p>\u003c/div>\u003cspan class=\"s\" style=\"color:var(--mute)\">Sold out\u003c/span>\u003ca class=\"link\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection id=\"format\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"sh\">\u003cdiv class=\"no\">02 — Il format\u003c/div>\u003cdiv>\u003ch2>Come \u003cem>funziona\u003c/em>\u003c/h2>\u003c/div>\u003c/div>\n\u003cdiv class=\"cols\">\n\u003cdiv class=\"col\">\u003cdiv class=\"n\">1\u003c/div>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la serata nella tua città. Più biglietti in un'unica transazione, se vieni in compagnia.\u003c/p>\u003c/div>\n\u003cdiv class=\"col\">\u003cdiv class=\"n\">2\u003c/div>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti presentare. Cinque minuti, anche con un PDF di slide.\u003c/p>\u003c/div>\n\u003cdiv class=\"col\">\u003cdiv class=\"n\">3\u003c/div>\u003ch3>Conosci le persone\u003c/h3>\u003cp>Si chiacchiera, si brinda, e le connessioni continuano anche dopo la serata.\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\n\u003cdiv class=\"sh\">\u003cdiv class=\"no\">03 — Per chi è\u003c/div>\u003cdiv>\u003ch2>Un posto dove \u003cem>stare bene\u003c/em>\u003c/h2>\u003c/div>\u003c/div>\n\u003cdiv class=\"who\">\u003cp>\u003cb>Single tra i 25 e i 40 anni\u003c/b> che vogliono conoscere gente nuova senza passare dalle app.\u003c/p>\u003cp>\u003cb>Amici di single\u003c/b> che hanno una persona fantastica da raccontare al mondo.\u003c/p>\u003cp>\u003cb>Chi è introverso\u003c/b>: il format è pensato per mettere a proprio agio.\u003c/p>\u003cp>\u003cb>La comunità LGBTQ+\u003c/b>, in uno spazio informale e inclusivo.\u003c/p>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"apply\" id=\"candidati\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"sh\">\u003cdiv class=\"no\">04 — Candidature\u003c/div>\u003cdiv>\u003ch2>Hai un amico \u003cem>da presentare?\u003c/em>\u003c/h2>\u003cp class=\"lead\">Raccontaci chi è. Ti ricontattiamo per scegliere la data e preparare il pitch.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"fg\">\u003cdiv>\u003c/div>\n\u003cform onsubmit=\"return false\">\u003cdiv class=\"two\">\u003cinput placeholder=\"Il tuo nome\">\u003cinput placeholder=\"Email\">\u003c/div>\u003cinput placeholder=\"Nome del tuo amico\">\u003ctextarea placeholder=\"Perché dovremmo conoscerlo?\">\u003c/textarea>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\u003cbutton class=\"btn\">Invia candidatura\u003c/button>\u003c/form>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\n\u003cdiv class=\"sh\">\u003cdiv class=\"no\">05 — Stampa\u003c/div>\u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection id=\"faq\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"sh\">\u003cdiv class=\"no\">06 — FAQ\u003c/div>\u003cdiv>\u003ch2>Domande \u003cem>frequenti\u003c/em>\u003c/h2>\u003c/div>\u003c/div>\n\u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire anche da solo.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Posso acquistare più biglietti insieme?\u003c/summary>\u003cp>Sì, ognuno con il proprio QR code.\u003c/p>\u003c/details>\n\u003c/div>\u003c/section>\n\n\u003cfooter>\u003cdiv class=\"wrap\">\u003cspan>© Pitcha l'Amico\u003c/span>\u003cdiv>\u003ca href=\"#\">Termini\u003c/a>\u003ca href=\"#\">Privacy\u003c/a>\u003ca href=\"#\">Cookie\u003c/a>\u003ca href=\"#\">Contatti\u003c/a>\u003c/div>\u003c/div>\u003c/footer>\n\u003cdiv class=\"spec\">\u003cdiv class=\"wrap\">\u003cdiv style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)\">Palette e tipografia\u003c/div>\n\u003cp style=\"font-family:'Instrument Serif';font-size:40px;margin-top:10px\">\u003cem>Instrument Serif\u003c/em> \u003cspan style=\"font-family:Inter;font-size:15px;color:var(--mute)\">per i titoli · Inter per i testi\u003c/span>\u003c/p>\n\u003cdiv class=\"sw\">\u003cdiv>\u003ci style=\"background:#FAF8F4\">\u003c/i>\u003cspan>Carta #FAF8F4\u003c/span>\u003c/div>\u003cdiv>\u003ci style=\"background:#141414\">\u003c/i>\u003cspan>Inchiostro #141414\u003c/span>\u003c/div>\u003cdiv>\u003ci style=\"background:#E81F32\">\u003c/i>\u003cspan>Rosso brand #E81F32\u003c/span>\u003c/div>\u003cdiv>\u003ci style=\"background:#6b6760\">\u003c/i>\u003cspan>Grigio #6B6760\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003c/body>\u003c/html>\n"},{"title":"Proposta 4 Pop anni 90","html":"\u003c!doctype html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pitcha l'Amico – Proposta 4 Pop anni 90\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;500;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--teal:#00C9BD;--yel:#FFE633;--pink:#FF3EA5;--vio:#5B2EFF;--red:#E81F32;--ink:#16103A;--white:#fff}\n*{box-sizing:border-box;margin:0}\nbody{font-family:'Poppins',sans-serif;background:var(--white);color:var(--ink);line-height:1.5;overflow-x:hidden;\n background-image:radial-gradient(var(--ink) 1.2px,transparent 1.4px);background-size:2 sparent;border-right:50px solid transparent;border-bottom:90px solid var(--pink);transform:rotate(-15deg);filter:drop-shadow(4px 4px 0 var(--ink))}\n.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}\n.hero h1{font-size:clamp(40px,7vw,86px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);text-transform:uppercase}\n.hero h1 span{color:var(--yel)}\n.hero p{font-weight:700;font-size:19px;margin:26px 0 30px;max-width:460px}\n.hero .ctas{display:flex;gap:18px;flex-wrap:wrap}\n.tape{position:relative;height:340px}\n.tape div{position:absolute;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px;font-weight:800}\n.t1{background:var(--pink);color:#fff;width:70%;left:0;top:10px;transform:rotate(-6deg);font-family:'Bungee';font-size:28px}\n.t2{background:#fff;width:68%;right:0;top:120px;transform:rotate(5deg)}\n.t3{background:var(--yel);width:55%;left:12%;bottom:0;transform:rotate(-2deg);font-family:'Bungee';font-size:44px;text-align:center}\n\n.marq{background:var(--ink);color:var(--yel);font-family:'Bungee';overflow:hidden;white-space:nowrap;padding:14px 0;font-size:22px;border-bottom:4px solid var(--ink)}\n.marq span{display:inline-block;animation:m 20s linear infinite;padding-right:30px}\n@keyframes m{to{transform:translateX(-100%)}}\n\nsection{padding:80px 0;position:relative}\n.tag{display:inline-block;background:var(--ink);color:var(--yel);font-weight:800;font-size:12px;letter-spacing:.12em;padding:5px 12px;text-transform:uppercase;transform:rotate(-2deg);margin-bottom:14px}\nh2{font-size:clamp(32px,5vw,58px);text-transform:uppercase;text-shadow:4px 4px 0 var(--yel);margin-bottom:12px}\n.lead{font-weight:500;font-size:18px;max-width:560px;margin-bottom:36px}\n\n.ev{display:grid;grid-template-columns:96px 1fr auto;gap:20px;align-items:center;background:#fff;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px;margin-bottom:24px}\n.ev:nth-child(even){background:var(--yel);transform:rotate(.6deg)}.ev:nth-child(odd){transform:rotate(-.6deg)}\n.d{background:var(--vio);color:#fff;border:3px solid var(--ink);text-align:center;padding:6px 0}.d b{display:block;font-family:'Bungee';font-weight:400;font-size:36px;line-height:1}.d span{font-weight:800;font-size:12px;text-transform:uppercase}\n.ev h3{font-size:28px}.ev p{font-size:13px;font-weight:600}\n.pill{display:inline-block;font-weight:800;font-size:11px;background:var(--red);color:#fff;padding:3px 10px;border-radius:99px;margin-bottom:4px;text-transform:uppercase}\n.pill.g{background:#bbb}\n\n.steps{background:var(--pink);border-block:4px solid var(--ink)}\n.steps h2{color:#fff;text-shadow:4px 4px 0 var(--ink)}\n.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}\n.st{background:#fff;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:26px;position:relative}\n.st .n{position:absolute;top:-26px;left:18px;width:56px;height:56px;border-radius:50%;background:var(--yel);border:4px solid var(--ink);display:grid;place-items:center;font-family:'Bungee';font-size:26px}\n.st h3{font-size:22px;margin:22px 0 8px}.st p{font-size:15px;font-weight:500}\n.st:nth-child(2){transform:rotate(1.5deg)}.st:nth-child(1){transform:rotate(-1.5deg)}\n\n.who{display:flex;gap:18px;flex-wrap:wrap}\n.chip{border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px 22px;font-weight:700;max-width:340px}\n.chip b{display:block;font-family:'Bungee';font-weight:400;font-size:20px;margin-bottom:4px}\n.chip:nth-child(1){background:var(--teal)}.chip:nth-child(2){background:var(--yel)}.chip:nth-child(3){background:#fff}.chip:nth-child(4){background:var(--pink);color:#fff}\n\n.apply{background:var(--vio);color:#fff;border-block:4px solid var(--ink)}\n.apply h2{text-shadow:4px 4px 0 var(--pink)}\n.apply .wrap{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}\nform{background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--yel);padding:26px;display:grid;gap:14px;transform:rotate(1deg)}\ninput,textarea{font:inherit;font-weight:500;padding:11px 14px;border:3px solid var(--ink);background:#fffbe2;width:100%}\ntextarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.chk{font-size:12px;font-weight:600;display:flex;gap:8px}.chk input{width:auto}\n\n.press{display:flex;flex-wrap:wrap;gap:14px}\n.press span{font-family:'Bungee';font-size:18px;border:3px solid var(--ink);background:#fff;padding:8px 16px;box-shadow:4px 4px 0 var(--ink)}\ndetails{background:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px 22px;margin-bottom:20px}\nsummary{cursor:pointer;font-weight:800;font-size:17px;list-style:none;display:flex;justify-content:space-between}\nsummary::after{content:\"+\";font-family:'Bungee';color:var(--pink);font-size:24px}details[open] summary::after{content:\"–\"}\ndetails[open]{background:var(--teal)}details p{margin-top:8px;font-weight:500}\nfooter{background:var(--ink);color:#fff;padding:44px 0;font-size:14px;font-weight:600}\nfooter .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}footer a{margin-left:18px;color:var(--yel)}\n.spec{background:#fff;border-top:4px solid var(--ink);padding:56px 0}\n.sw{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.sw div{width:112px;border:3px solid var(--ink);font-size:11px;font-weight:700}.sw i{display:block;height:54px;border-bottom:3px solid var(--ink)}.sw span{display:block;padding:5px 8px}\n\n@media(max-width:860px){.menu a:not(.btn){display:none}.hero .wrap,.apply .wrap,.g3{grid-template-columns:1fr}.tape{height:300px}.ev{grid-template-columns:80px 1fr}.ev .btn{grid-column:1/-1;text-align:center}.two{grid-template-columns:1fr}.g3{gap:44px}.hero::before{width:180px;height:180px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"note\">PROPOSTA 4 – POP ANNI '90 · TESTI ED EVENTI SEGNAPOSTO\u003c/div>\n\u003cnav>\u003cdiv class=\"wrap\">\u003ca class=\"logo\" href=\"#\">Pitcha l'Amico\u003c/a>\n\u003cdiv class=\"menu\">\u003ca href=\"#format\">Format\u003c/a>\u003ca href=\"#eventi\">Eventi\u003c/a>\u003ca href=\"#candidati\">Candidati\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca class=\"btn y sm\" href=\"#eventi\" style=\"color:var(--ink);transform:none\">Biglietti\u003c/a>\u003c/div>\u003c/div>\u003c/nav>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n\u003cdiv>\u003ch1>Pitcha il tuo amico \u003cspan>single!\u003c/span>\u003c/h1>\u003cp>5 minuti sul palco, un amico che ti presenta e una sala piena di gente nuova. Dal vivo, senza app. Che ansia? No, che figata.\u003c/p>\n\u003cdiv class=\"ctas\">\u003ca class=\"btn y\" href=\"#eventi\">Scopri gli eventi\u003c/a>\u003ca class=\"btn\" href=\"#candidati\">Presenta un amico\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"tape\">\u003cdiv class=\"t1\">\"È un tipo da cenone di Natale!\"\u003c/div>\u003cdiv class=\"t2\">PITCH IN CORSO...\u003cbr>Giulia presenta Marco • 4:32\u003c/div>\u003cdiv class=\"t3\">5 MIN\u003c/div>\u003c/div>\n\u003c/div>\u003c/header>\n\u003cdiv class=\"marq\">\u003cspan>★ PITCHA IL TUO AMICO ★ CONOSCI PERSONE VERE ★ SERATE DAL VIVO ★ PITCHA IL TUO AMICO ★ CONOSCI PERSONE VERE ★ SERATE DAL VIVO ★ PITCHA IL TUO AMICO ★ CONOSCI PERSONE VERE ★ SERATE DAL VIVO\u003c/span>\u003c/div>\n\n\u003csection id=\"eventi\">\u003cdiv class=\"wrap\">\n\u003cspan class=\"tag\">Prossime date\u003c/span>\u003ch2>Trova la tua serata\u003c/h2>\u003cp class=\"lead\">Scegli la città, prendi il biglietto e ricevi il QR code via email. Facile come una cassetta.\u003c/p>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">\u003cb>21\u003c/b>\u003cspan>Nov\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"pill\">Ultimi posti\u003c/span>\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003c/div>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">\u003cb>05\u003c/b>\u003cspan>Dic\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"pill\" style=\"background:var(--teal);color:var(--ink)\">Disponibile\u003c/span>\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003c/div>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">\u003cb>18\u003c/b>\u003cspan>Gen\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"pill g\">Sold out\u003c/span>\u003ch3>Roma\u003c/h3>\u003cp>Sabato · 21:00 · Lista d'attesa aperta\u003c/p>\u003c/div>\u003ca class=\"btn sm t\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"steps\" id=\"format\">\u003cdiv class=\"wrap\">\u003cspan class=\"tag\">Il format\u003c/span>\u003ch2>Come funziona\u003c/h2>\u003cp class=\"lead\" style=\"color:#fff\">Tre mosse e sei dentro.\u003c/p>\n\u003cdiv class=\"g3\">\n\u003cdiv class=\"st\">\u003cdiv class=\"n\">1\u003c/div>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la data nella tua città. Più biglietti in un solo acquisto, se vieni in compagnia.\u003c/p>\u003c/div>\n\u003cdiv class=\"st\">\u003cdiv class=\"n\">2\u003c/div>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti pitchare. Cinque minuti, anche con un PDF di slide.\u003c/p>\u003c/div>\n\u003cdiv class=\"st\">\u003cdiv class=\"n\">3\u003c/div>\u003ch3>Conosci gente\u003c/h3>\u003cp>Si chiacchiera, si brinda, e le connessioni continuano anche dopo la serata.\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\u003cspan class=\"tag\">Per chi è\u003c/span>\u003ch2>Per tutti i tipi\u003c/h2>\u003cp class=\"lead\">Un ambiente informale, dove stare a proprio agio.\u003c/p>\n\u003cdiv class=\"who\">\u003cdiv class=\"chip\">\u003cb>Single 25–40\u003c/b>Gente nuova, senza app.\u003c/div>\u003cdiv class=\"chip\">\u003cb>Amici di single\u003c/b>Racconta quanto è bravo.\u003c/div>\u003cdiv class=\"chip\">\u003cb>Introversi\u003c/b>Tranquilli, c'è chi parla per voi.\u003c/div>\u003cdiv class=\"chip\">\u003cb>LGBTQ+\u003c/b>Spazio inclusivo per tutti.\u003c/div>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"apply\" id=\"candidati\">\u003cdiv class=\"wrap\">\n\u003cdiv>\u003cspan class=\"tag\" style=\"background:var(--yel);color:var(--ink)\">Candidature\u003c/span>\u003ch2>Hai un amico da presentare?\u003c/h2>\u003cp class=\"lead\" style=\"margin:0\">Compila il modulo: ti scriviamo per fissare la data e preparare il pitch insieme.\u003c/p>\u003c/div>\n\u003cform onsubmit=\"return false\">\u003cdiv class=\"two\">\u003cinput placeholder=\"Il tuo nome\">\u003cinput placeholder=\"Email\">\u003c/div>\u003cinput placeholder=\"Nome del tuo amico\">\u003ctextarea placeholder=\"Perché dobbiamo conoscerlo?\">\u003c/textarea>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\u003cbutton class=\"btn\">Invia candidatura\u003c/button>\u003c/form>\n\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\u003cspan class=\"tag\">Dicono di noi\u003c/span>\u003ch2>Sui giornali\u003c/h2>\u003cbr>\u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection style=\"padding-top:0\" id=\"faq\">\u003cdiv class=\"wrap\" style=\"max-width:780px\">\u003cspan class=\"tag\">FAQ\u003c/span>\u003ch2>Domande frequenti\u003c/h2>\u003cbr>\n\u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire anche da solo.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Posso acquistare più biglietti insieme?\u003c/summary>\u003cp>Sì, ognuno con il proprio QR code.\u003c/p>\u003c/details>\n\u003c/div>\u003c/section>\n\u003cdiv class=\"zig\">\u003c/div>\n\u003cfooter>\u003cdiv class=\"wrap\">\u003cspan class=\"b\" style=\"color:var(--yel)\">Pitcha l'Amico\u003c/span>\u003cdiv>\u003ca href=\"#\">Termini\u003c/a>\u003ca href=\"#\">Privacy\u003c/a>\u003ca href=\"#\">Cookie\u003c/a>\u003ca href=\"#\">Contatti\u003c/a>\u003c/div>\u003c/div>\u003c/footer>\n\u003cdiv class=\"spec\">\u003cdiv class=\"wrap\">\u003cspan class=\"tag\">Palette e tipografia\u003c/span>\n\u003cp class=\"b\" style=\"font-size:34px;color:var(--vio)\">Bungee \u003cspan style=\"font-family:Poppins;font-size:15px;color:var(--ink)\">per i titoli · Poppins per i testi\u003c/span>\u003c/p>\n\u003cdiv class=\"sw\">\u003cdiv>\u003ci style=\"background:#00C9BD\">\u003c/i>\u003cspan>Turchese #00C9BD\u003c/span>\u003c/div>\u003cdiv>\u003ci style=\"background:#FFE633\">\u003c/i>\u003cspan>Giallo #FFE633\u003c/span>\u003c/div>\u003cdiv>\u003ci style=\"background:#FF3EA5\">\u003c/i>\u003cspan>Rosa #FF3EA5\u003c/span>\u003c/div>\u003cdiv>\u003ci style=\"background:#5B2EFF\">\u003c/i>\u003cspan>Viola #5B2EFF\u003c/span>\u003c/div>\u003cdiv>\u003ci style=\"background:#E81F32\">\u003c/i>\u003cspan>Rosso brand #E81F32\u003c/span>\u003c/div>\u003cdiv>\u003ci style=\"background:#16103A\">\u003c/i>\u003cspan>Inchiostro #16103A\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003c/body>\u003c/html>\n"},{"title":"Proposta 5 Fresco e moderno","html":"\u003c!doctype html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pitcha l'Amico – Proposta 5 Fresco e moderno\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\ t-weight:700;box-shadow:0 4px 14px rgba(15,42,42,.07);margin-bottom:26px}\n.pillt i{width:8px;height:8px;border-radius:50%;background:var(--red)}\n.hero h1{font-size:clamp(44px,7.4vw,92px);max-width:900px;margin:0 auto 22px}\n.hero h1 span{background:linear-gradient(90deg,var(--teal),#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}\n.hero p{max-width:520px;margin:0 auto 34px;color:var(--mute);font-size:18px}\n.hero .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}\n\n.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:18px;margin-top:70px}\n.bx{border-radius:var(--r);padding:26px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;position:relative;overflow:hidden}\n.bx .big{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1}\n.bx small{font-weight:600;color:var(--mute)}\n.x1{grid-column:span 3;grid-row:span 2;background:var(--mint)}\n.x2{grid-column:span 3;background:var(--sky)}\n.x3{grid-column:span 1;background:var(--sun)}\n.x4{grid-column:span 2;background:var(--lav)}\n.x1 .quote{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:12px}\n\nsection{padding:96px 0}\n.sec h2{font-size:clamp(32px,4.6vw,54px);margin-bottom:12px}\n.k{display:inline-block;background:var(--mint);color:var(--teal);font-weight:700;font-size:12px;padding:5px 14px;border-radius:99px;margin-bottom:16px;letter-spacing:.04em}\n.lead{color:var(--mute);font-size:18px;max-width:560px;margin-bottom:40px}\n\n.evs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}\n.ev{background:#fff;border-radius:var(--r);padding:26px;box-shadow:0 10px 36px rgba(15,42,42,.06);display:flex;flex-direction:column;gap:6px;transition:.2s}\n.ev:hover{transform:translateY(-6px);box-shadow:0 18px 44px rgba(15,42,42,.12)}\n.dt{display:inline-flex;align-items:baseline;gap:6px}.dt b{font-size:54px;font-weight:800;letter-spacing:-.05em;line-height:1}.dt span{font-weight:700; 003cspan>single.\u003c/span>\u003c/h1>\n\u003cp>Cinque minuti sul palco, un amico che parla di te e una sala piena di persone da conoscere. Dal vivo, senza app.\u003c/p>\n\u003cdiv class=\"ctas\">\u003ca class=\"btn\" href=\"#eventi\">Scopri gli eventi\u003c/a>\u003ca class=\"btn sec\" href=\"#candidati\">Presenta un amico\u003c/a>\u003c/div>\n\u003cdiv class=\"bento\">\n\u003cdiv class=\"bx x1\">\u003cdiv class=\"quote\">\"È il tipo che ti sposta il divano senza chiedere perché.\"\u003c/div>\u003csmall>Giulia, sul palco per Marco\u003c/small>\u003c/div>\n\u003cdiv class=\"bx x2\">\u003cdiv class=\"big\">5 min\u003c/div>\u003csmall>per convincere la sala\u003c/small>\u003c/div>\n\u003cdiv class=\"bx x3\">\u003cdiv class=\"big\">25+\u003c/div>\u003csmall>anni\u003c/small>\u003c/div>\n\u003cdiv class=\"bx x4\">\u003cdiv class=\"big\">3 città\u003c/div>\u003csmall>e altre in arrivo\u003c/small>\u003c/div>\n\u003c/div>\u003c/div>\u003c/header>\n\n\u003csection class=\"sec\" id=\"eventi\">\u003cdiv class=\"wrap\">\n\u003cspan class=\"k\">PROSSIME DATE\u003c/span>\u003ch2>Trova la tua serata\u003c/h2>\u003cp class=\"lead\">Scegli la città, prendi il biglietto e ricevi il QR code via email.\u003c/p>\n\u003cdiv class=\"evs\">\n\u003cdiv class=\"ev\">\u003cspan class=\"tg\">Ultimi posti\u003c/span>\u003cdiv class=\"dt\">\u003cb>21\u003c/b>\u003cspan>Nov\u003c/span>\u003c/div>\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · 20:30\u003cbr>Locale da definire\u003c/p>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cspan class=\"tg o\">Disponibile\u003c/span>\u003cdiv class=\"dt\">\u003cb>05\u003c/b>\u003cspan>Dic\u003c/span>\u003c/div>\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · 20:30\u003cbr>Locale da definire\u003c/p>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cspan class=\"tg s\">Sold out\u003c/span>\u003cdiv class=\"dt\">\u003cb>18\u003c/b>\u003cspan>Gen\u003c/span>\u003c/div>\u003ch3>Roma\u003c/h3>\u003cp>Sabato · 21:00\u003cbr>Lista d'attesa aperta\u003c/p>\u003ca class=\"btn sm sec\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"sec how\" id=\"format\">\u003cdiv class=\"wrap\">\n\u003cspan class=\"k\">IL FORMAT\u003c/span>\u003ch2>Come funziona\u003c/h2>\u003cp class=\"lead\">Tre passi, zero imbarazzo.\u003c/p>\n\u003cdiv class=\"g3\">\n\u003cdiv class=\"st\">\u003cdiv class=\"n\">1\u003c/div>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la data nella tua città. Più biglietti in un solo acquisto, se vieni in compagnia.\u003c/p>\u003c/div>\n\u003cdiv class=\"st\">\u003cdiv class=\"n\">2\u003c/div>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti presentare: cinque minuti, anche con un PDF.\u003c/p>\u003c/div>\n\u003cdiv class=\"st\">\u003cdiv class=\"n\">3\u003c/div>\u003ch3>Conosci le persone\u003c/h3>\u003cp>Si chiacchiera e si brinda. Le connessioni continuano anche dopo la serata.\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"sec\">\u003cdiv class=\"wrap\">\n\u003cspan class=\"k\">PER CHI È\u003c/span>\u003ch2>Un posto dove stare bene\u003c/h2>\u003cp class=\"lead\">Ambiente informale e accogliente per tutte e tutti.\u003c/p>\n\u003cdiv class=\"who\">\u003cspan class=\"chip\">\u003ci>💬\u003c/i>Single 25–40\u003c/span>\u003cspan class=\"chip\">\u003ci>🤝\u003c/i>Amici di single\u003c/span>\u003cspan class=\"chip\">\u003ci>🌱\u003c/i>Introversi benvenuti\u003c/span>\u003cspan class=\"chip\">\u003ci>🌈\u003c/i>Comunità LGBTQ+\u003c/span>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"sec apply\" id=\"candidati\" style=\"padding-top:20px\">\u003cdiv class=\"box\">\n\u003cdiv>\u003cspan class=\"k\" style=\"background:rgba(255,255,255,.2);color:#fff\">CANDIDATURE\u003c/span>\u003ch2>Hai un amico da presentare?\u003c/h2>\u003cp class=\"lead\">Compila il modulo: ti ricontattiamo per fissare la data e preparare il pitch.\u003c/p>\u003c/div>\n\u003cform onsubmit=\"return false\">\u003cdiv class=\"two\">\u003cinput placeholder=\"Il tuo nome\">\u003cinput placeholder=\"Email\">\u003c/div>\u003cinput placeholder=\"Nome del tuo amico\">\u003ctextarea placeholder=\"Perché dovremmo conoscerlo?\">\u003c/textarea>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\u003cbutton class=\"btn\">Invia candidatura\u003c/button>\u003c/form>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"sec\" style=\"padding-top:20px\">\u003cdiv class=\"wrap\">\u003cspan class=\"k\">DICONO DI NOI\u003c/span>\u003cbr>\u003cbr>\u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"sec\" id=\"faq\" style=\"padding-top:0\">\u003cdiv class=\"wrap\" style=\"max-width:780px\">\u003cspan class=\"k\">FAQ\u003c/span>\u003ch2>Domande frequenti\u003c/h2>\u003cbr>\n\u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire anche da solo.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Posso acquistare più biglietti insieme?\u003c/summary>\u003cp>Sì, ognuno con il proprio QR code.\u003c/p>\u003c/details>\n\u003c/div>\u003c/section>\n\n\u003cfooter>\u003cdiv class=\"wrap\">\u003cspan class=\"logo\">pitcha \u003cb>l'amico\u003c/b>\u003c/span>\u003cdiv>\u003ca href=\"#\">Termini\u003c/a>\u003ca href=\"#\">Privacy\u003c/a>\u003ca href=\"#\">Cookie\u003c/a>\u003ca href=\"#\">Contatti\u003c/a>\u003c/div>\u003c/div>\u003c/footer>\n\u003cdiv class=\"spec\">\u003cdiv class=\"wrap\">\u003cspan class=\"k\">PALETTE E TIPOGRAFIA\u003c/span>\n\u003cp style=\"font-weight:800;font-size:34px;letter-spacing:-.03em\">Plus Jakarta Sans \u003cspan style=\"font-size:15px;font-weight:500;color:var(--mute)\">titoli e testi, in pesi diversi\u003c/span>\u003c/p>\n\u003cdiv class=\"sw\">\u003cdiv>\u003ci style=\"background:#BFF0E1\">\u003c/i>Menta #BFF0E1\u003c/div>\u003cdiv>\u003ci style=\"background:#CFE8FF\">\u003c/i>Cielo #CFE8FF\u003c/div>\u003cdiv>\u003ci style=\"background:#E0D9FF\">\u003c/i>Lavanda #E0D9FF\u003c/div>\u003cdiv>\u003ci style=\"background:#FFE9B8\">\u003c/i>Sole #FFE9B8\u003c/div>\u003cdiv>\u003ci style=\"background:#0E7C7B\">\u003c/i>Petrolio #0E7C7B\u003c/div>\u003cdiv>\u003ci style=\"background:#E81F32\">\u003c/i>Rosso brand #E81F32\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003c/body>\u003c/html>\n"},{"title":"Proposta 6 Teatro","html":"\u003c!doctype html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pitcha l'Amico – Proposta 6 Teatro\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,500&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--curt:#8E0F1E;--curt2:#6B0916;--red:#E81F32;--cream:#FCEFB4;--paper:#F7E9C0;--gold:#D9A441;--ink:#1A0D0D}\n*{box-sizing:border-box;margin:0}\nbody{font-family:'IBM Plex Mono',monospace;background:var(--curt2);color:var(--cream);line-height:1.6;overflow-x:hidden;font-size:15px}\na{color:inherit;text-decoration:none}\n.wrap{max-width:1080px;margin:0 auto;padding:0 22px}\nh1,h2,h3{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.03em;line-height:.95}\n.note{background:#000;color:var(--gold);font-size:11px;text-align:center;padding:6px;letter-spacing:.1em}\n.curtain{background:repeating-linear-gradient(90deg,var(--curt)
