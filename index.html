x-width:560px;margin-bottom:44px}\n\n.tk{display:grid;grid-template-columns:1fr 190px;background:var(--cream);color:var(--ink);margin-bottom:28px;position:relative;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.45));-webkit-mask:radial-gradient(circle 14px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 14px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}\n.tk .main{padding:26px 34px;display:grid;grid-template-columns:110px 1fr;gap:26px;align-items:center}\n.tk .dt{font-family:'Bebas Neue';font-size:80px;line-height:.85;color:var(--red);text-align:center}.tk .dt small{display:block;font-size:24px;color:var(--ink);letter-spacing:.1em}\n.tk h3{font-size:50px;color:var(--ink)}.tk p{font-size:12px;letter-spacing:.06em;text-transform:uppercase}\n.tk .stub{border-left:3px dashed var(--ink);padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.1em;background:#fff6d0}\n.tk .stub b{font-family:'Bebas Neue';font-size:30px;letter-spacing:.06em;color:var(--curt)}\n.tk.sold{opacity:.65}.tk.sold .dt{color:#777}\n\n.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:3px solid var(--ink)}\n.act{padding:34px 28px;border-right:3px solid var(--ink)}.act:last-child{border:0}\n.act .n{font-family:'Bebas Neue';font-size:20px;letter-spacing:.2em;color:var(--curt)}\n.act h3{font-size:50px;margin:6px 0 12px}.act p{font-size:14px}\n\n.cast{display:grid;grid-template-columns:repeat(2,1fr);gap:0 60px}\n.cast div{padding:20px 0;border-bottom:1px dotted var(--gold);display:flex;justify-content:space-between;gap:16px;align-items:baseline}\n.cast b{font-family:'Bebas Neue';font-weight:400;font-size:32px;letter-spacing:.04em}.cast span{font-size:13px;text-align:right;color:#e8d6a0}\n\n.audition{background:var(--curt)}\n.audition .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}\nform{background:var(--cream);color:var(--ink);padding:30px;display:grid;gap:14px;border:3px solid #000;box-shadow:8px 8px 0 #000}\nform h3{font-size:30px;color:var(--curt)}\ninput,textarea{font:inherit;padding:11px 12px;border:2px solid var(--ink);background:#fffbe9;width:100%}textarea{min-height:80px}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chk{font-size:11px;display:flex;gap:8px}.chk input{width:auto}\n\n.press{display:flex;flex-wrap:wrap;gap:10px 40px;font-family:'Playfair Display',serif;font-style:italic;font-size:26px}\n.press span:before{content:\"“\";color:var(--gold)}.press span:after{content:\"”\";color:var(--gold)}\ndetails{border-top:2px solid var(--ink);padding:18px 0}details:last-of-type{border-bottom:2px solid var(--ink)}\nsummary{cursor:pointer;font-family:'Bebas Neue';font-size:32px;letter-spacing:.04em;list-style:none;display:flex;justify-content:space-between}\nsummary::after{content:\"+\";color:var(--curt)}details[open] summary::after{content:\"–\"}details p{margin-top:6px;max-width:620px}\nfooter{background:#000;padding:40px 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase}footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}footer a{margin-left:20px;color:var(--gold)}\n.spec{background:#111;padding:50px 0}.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.sw div{width:110px;font-size:10px}.sw i{display:block;height:50px;border:1px solid #444;margin-bottom:5px}\n\n@media(max-width:820px){.menu a:not(.btn){display:none}.tk{grid-template-columns:1fr}.tk .main{grid-template-columns:90px 1fr;padding:20px}.tk .stub{border-left:0;border-top:3px dashed var(--ink);flex-direction:row;justify-content:space-between}.acts,.cast,.audition .wrap{grid-template-columns:1fr}.act{border-right:0;border-bottom:3px solid var(--ink)}.two{grid-template-columns:1fr}.tk{-webkit-mask:none;mask:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"note\">PROPOSTA 6 – TEATRO / CARTELLONE LIVE · TESTI ED EVENTI SEGNAPOSTO\u003c/div>\n\u003cnav>\u003cdiv class=\"wrap\">\u003ca class=\"logo\" href=\"#\">Pitcha l'Amico\u003c/a>\n\u003cdiv class=\"menu\">\u003ca href=\"#format\">Il format\u003c/a>\u003ca href=\"#cartellone\">Cartellone\u003c/a>\u003ca href=\"#provino\">Provino\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca class=\"btn sm\" href=\"#cartellone\">Biglietti\u003c/a>\u003c/div>\u003c/div>\u003c/nav>\n\n\u003cheader class=\"hero curtain\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"pres\">Stasera in scena\u003c/div>\n\u003ch1>Pitcha il tuo amico \u003cb>single\u003c/b>\u003c/h1>\n\u003cp class=\"sub\">Cinque minuti di palco, un pubblico che ascolta e una serata da ricordare.\u003c/p>\n\u003ca class=\"btn\" href=\"#cartellone\">Vedi il cartellone\u003c/a>&nbsp;&nbsp;\u003ca class=\"btn r\" href=\"#provino\">Presenta un amico\u003c/a>\n\u003c/div>\u003cdiv class=\"stage\">\u003c/div>\u003c/header>\n\n\u003csection id=\"cartellone\" style=\"background:var(--curt2)\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"kick\">In cartellone\u003c/div>\u003ch2>Prossime serate\u003c/h2>\u003cp class=\"lead\">Scegli lo spettacolo, stacca il tuo biglietto: il QR code arriva via email.\u003c/p>\n\u003cdiv class=\"tk\">\u003cdiv class=\"main\">\u003cdiv class=\"dt\">21\u003csmall>NOV\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · ore 20:30 · Locale da definire · Ultimi posti\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"stub\">\u003cb>Platea\u003c/b>\u003ca class=\"btn sm r\" href=\"#\">Acquista\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"tk\">\u003cdiv class=\"main\">\u003cdiv class=\"dt\">05\u003csmall>DIC\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · ore 20:30 · Locale da definire · Disponibile\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"stub\">\u003cb>Platea\u003c/b>\u003ca class=\"btn sm r\" href=\"#\">Acquista\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"tk sold\">\u003cdiv class=\"main\">\u003cdiv class=\"dt\">18\u003csmall>GEN\u003c/small>\u003c/div>\u003cdiv>\u003ch3>Roma\u003c/h3>\u003cp>Sabato · ore 21:00 · Tutto esaurito\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"stub\">\u003cb>Sold out\u003c/b>\u003ca class=\"btn sm\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"light\" id=\"format\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"kick\">Lo spettacolo\u003c/div>\u003ch2>Tre atti\u003c/h2>\u003cp class=\"lead\">Dal biglietto all'applauso, senza imbarazzo.\u003c/p>\n\u003cdiv class=\"acts\">\n\u003cdiv class=\"act\">\u003cdiv class=\"n\">ATTO I\u003c/div>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la serata nella tua città. Più biglietti in un solo acquisto, se vieni in compagnia.\u003c/p>\u003c/div>\n\u003cdiv class=\"act\">\u003cdiv class=\"n\">ATTO II\u003c/div>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti presentare: cinque minuti, anche con un PDF di slide.\u003c/p>\u003c/div>\n\u003cdiv class=\"act\">\u003cdiv class=\"n\">ATTO III\u003c/div>\u003ch3>Conosci le persone\u003c/h3>\u003cp>Si esce dal palco e si chiacchiera. Le connessioni continuano oltre la serata.\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\n\u003cdiv class=\"kick\">Il cast\u003c/div>\u003ch2>Per chi è\u003c/h2>\u003cbr>\n\u003cdiv class=\"cast\">\u003cdiv>\u003cb>Single 25–40\u003c/b>\u003cspan>Gente nuova, senza app\u003c/span>\u003c/div>\u003cdiv>\u003cb>Amici di single\u003c/b>\u003cspan>Racconta quanto è bravo\u003c/span>\u003c/div>\u003cdiv>\u003cb>Introversi\u003c/b>\u003cspan>C'è chi parla per voi\u003c/span>\u003c/div>\u003cdiv>\u003cb>LGBTQ+\u003c/b>\u003cspan>Spazio inclusivo\u003c/span>\u003c/div>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"audition curtain\" id=\"provino\">\u003cdiv class=\"wrap\">\n\u003cdiv>\u003cdiv class=\"kick\">Casting aperto\u003c/div>\u003ch2>Hai un amico da portare sul palco?\u003c/h2>\u003cp class=\"lead\" style=\"margin:0\">Compila il provino: ti ricontattiamo per fissare la data e preparare il pitch.\u003c/p>\u003c/div>\n\u003cform onsubmit=\"return false\">\u003ch3>Modulo di provino\u003c/h3>\u003cdiv class=\"two\">\u003cinput placeholder=\"Il tuo nome\">\u003cinput placeholder=\"Email\">\u003c/div>\u003cinput placeholder=\"Nome del tuo amico\">\u003ctextarea placeholder=\"Perché dovremmo conoscerlo?\">\u003c/textarea>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\u003cbutton class=\"btn r\">Invia candidatura\u003c/button>\u003c/form>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"light\">\u003cdiv class=\"wrap\">\u003cdiv class=\"kick\">La critica\u003c/div>\u003cbr>\u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"light\" id=\"faq\" style=\"padding-top:0\">\u003cdiv class=\"wrap\" style=\"max-width:780px\">\u003cdiv class=\"kick\">FAQ\u003c/div>\u003ch2>Dietro le quinte\u003c/h2>\u003cbr>\n\u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire anche da solo.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Posso acquistare più biglietti insieme?\u003c/summary>\u003cp>Sì, ognuno con il proprio QR code.\u003c/p>\u003c/details>\n\u003c/div>\u003c/section>\n\n\u003cfooter>\u003cdiv class=\"wrap\">\u003cspan>© Pitcha l'Amico\u003c/span>\u003cdiv>\u003ca href=\"#\">Termini\u003c/a>\u003ca href=\"#\">Privacy\u003c/a>\u003ca href=\"#\">Cookie\u003c/a>\u003ca href=\"#\">Contatti\u003c/a>\u003c/div>\u003c/div>\u003c/footer>\n\u003cdiv class=\"spec\">\u003cdiv class=\"wrap\">\u003cdiv class=\"kick\">Palette e tipografia\u003c/div>\u003cp style=\"font-family:'Bebas Neue';font-size:38px;color:var(--cream)\">Bebas Neue \u003cspan style=\"font-family:'IBM Plex Mono';font-size:13px\">titoli · IBM Plex Mono testi · Playfair Display corsivi\u003c/span>\u003c/p>\n\u003cdiv class=\"sw\">\u003cdiv>\u003ci style=\"background:#8E0F1E\">\u003c/i>Sipario #8E0F1E\u003c/div>\u003cdiv>\u003ci style=\"background:#E81F32\">\u003c/i>Rosso brand #E81F32\u003c/div>\u003cdiv>\u003ci style=\"background:#FCEFB4\">\u003c/i>Crema #FCEFB4\u003c/div>\u003cdiv>\u003ci style=\"background:#D9A441\">\u003c/i>Oro #D9A441\u003c/div>\u003cdiv>\u003ci style=\"background:#1A0D0D\">\u003c/i>Nero #1A0D0D\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003c/body>\u003c/html>\n"},{"title":"Proposta 7 Fotografico","html":"\u003c!doctype html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pitcha l'Amico – Proposta 7 Fotografico\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--ink:#0c0c0c;--red:#E81F32;--w:#fff;--g:#bdbdbd}\n*{box-sizing:border-box;margin:0}\nbody{font-family:'Inter',sans-serif;background:var(--ink);color:var(--w);line-height:1.6;overflow-x:hidden}\na{color:inherit;text-decoration:none}\nh1,h2,h3{font-family:'Archivo Black',sans-serif;font-weight:400;line-height:.98;text-transform:uppercase;letter-spacing:-.01em}\n.wrap{max-width:1180px;margin:0 auto;padding:0 24px}\n/* \"foto\" segnaposto */\n.ph{position:relative;background:\n radial-gra :block;font-family:'Archivo Black';font-size:44px;font-weight:400}.stats span{font-size:13px;color:var(--g)}\n\nsection{padding:96px 0}\n.k{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin-bottom:14px}\nh2{font-size:clamp(38px,6vw,76px);margin-bottom:14px}\n.lead{color:var(--g);font-size:18px;max-width:560px;margin-bottom:44px}\n\n.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.tile{height:440px;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;position:relative}\n.tile:nth-child(2).ph{background:radial-gradient(circle at 60% 35%,rgba(120,150,255,.45),transparent 40%),radial-gradient(circle at 30% 70%,rgba(232,31,50,.4),transparent 40%),linear-gradient(160deg,#101a2e,#2a1a3a)}\n.tile:nth-child(3).ph{background:radial-gradient(circle at 40% 40%,rgba(255,200,100,.5),transparent 38%),linear-gradient(200deg,#3a2a14,#1a1008)}\n.tile::before{content:\"\";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.9))}\n.tile .in{position:relative;z-index:2;padding:26px;width:100%}\n.tile .dt{font-family:'Archivo Black';font-size:20px;color:var(--red)}\n.tile h3{font-size:44px;margin:4px 0 6px}.tile p{font-size:13px;color:#ddd;margin-bottom:16px}\n.badge{position:absolute;top:18px;left:18px;z-index:2;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:#fff;color:#000;padding:4px 10px;border-radius:99px}\n\n.how{background:#fff;color:var(--ink)}\n.how .lead{color:#555}\n.split{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}\n.how .ph{height:560px;border-radius:6px}\n.steps div{padding:24px 0;border-top:1px solid #ddd;display:grid;grid-template-columns:60px 1fr;gap:16px}\n.steps div:last-child{border-bottom:1px solid #ddd}\n.steps b{font-family:'Archivo Black';font-weight:400;font-size:34px;color:var(--red)}.steps h3{font-size:26px;margin-bottom:4px}.steps p{font-size:15px;color:#555}\n\n.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:230px 230px;gap:14px}\n.mosaic .ph{border-radius:6px}.mosaic .ph:first-child{grid-row:span 2}\n.mosaic .ph:nth-child(3){background:linear-gradient(120deg,#16302c,#0a1a18),radial-gradient(circle at 50% 50%,rgba(120,255,220,.3),transparent 40%)}\n.who{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px}.who div{border-top:2px solid var(--red);padding-top:14px}.who b{font-family:'Archivo Black';font-weight:400;text-transform:uppercase;display:block;margin-bottom:4px}.who span{font-size:14px;color:var(--g)}\n\n.apply{position:relative;overflow:hidden}\n.apply.ph::before{content:\"\";position:absolute;inset:0;background:rgba(10,5,8,.78)}\n.apply .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}\nform{display:grid;gap:12px;background:rgba(255,255,255,.07);backdrop-filter:blur(10px);padding:28px;border:1px solid rgba(255,255,255,.18);border-radius:8px}\ninput,textarea{font:inherit;color:#fff;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:13px 14px;width:100%}input::placeholder,textarea::placeholder{color:#999}textarea{min-height:84px}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chk{font-size:12px;color:var(--g);display:flex;gap:8px}.chk input{width:auto}\nform .btn{border:0;cursor:pointer}\n\n.press{display:flex;flex-wrap:wrap;gap:14px 46px;font-family:'Archivo Black';font-size:22px;text-transform:uppercase;color:#6d6d6d}\ndetails{border-top:1px solid #2b2b2b;padding:22px 0}details:last-of-type{border-bottom:1px solid #2b2b2b}\nsummary{cursor:pointer;font-weight:600;font-size:18px;list-style:none;display:flex;justify-content:space-between}summary::after{content:\"+\";color:var(--red);font-size:22px}details[open] summary::after{content:\"–\"}\ndetails p{margin-top:8px;color:var(--g);max-width:620px}\nfooter{border-top:1px solid #2b2b2b;padding:44px 0;font-size:13px;color:var(--g)}footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}footer a{margin-left:22px}\n.spec{background:#fff;color:var(--ink);padding:50px 0}.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.sw div{width:110px;font-size:11px;font-weight:600}.sw i{display:block;height:50px;border-radius:4px;border:1px solid #ddd;margin-bottom:5px}\n\n@media(max-width:860px){.menu a:not(.btn){display:none}.tiles,.split,.apply .wrap,.who{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.mosaic{grid-template-columns:1fr 1fr;grid-template-rows:200px 200px 200px}.mosaic .ph:first-child{grid-column:span 2;grid-row:span 1}.how .ph{height:320px}.two{grid-template-columns:1fr}section{padding:64px 0}.tile{height:380px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"note\">Proposta 7 – Fotografico · le zone con \"FOTO\" sono segnaposto: qui andranno le foto reali delle serate · testi ed eventi segnaposto\u003c/div>\n\u003cdiv style=\"position:relative\">\n\u003cnav>\u003cdiv class=\"wrap\">\u003ca class=\"logo\" href=\"#\">Pitcha \u003cb>l'Amico\u003c/b>\u003c/a>\n\u003cdiv class=\"menu\">\u003ca href=\"#format\">Format\u003c/a>\u003ca href=\"#eventi\">Eventi\u003c/a>\u003ca href=\"#candidati\">Candidati\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca class=\"btn sm\" href=\"#eventi\">Biglietti\u003c/a>\u003c/div>\u003c/div>\u003c/nav>\n\u003cheader class=\"hero ph\" data-l=\"FOTO – sala piena, persona sul palco al microfono\">\n\u003cdiv class=\"wrap\">\u003ch1>Pitcha il tuo amico \u003cem>single.\u003c/em>\u003c/h1>\u003cp>Cinque minuti sul palco, un amico che parla di te e una sala da conoscere. Dal vivo, senza app.\u003c/p>\n\u003cdiv class=\"row\">\u003ca class=\"btn\" href=\"#eventi\">Scopri gli eventi\u003c/a>\u003ca class=\"btn o\" href=\"#candidati\">Presenta un amico\u003c/a>\u003c/div>\u003c/div>\u003c/header>\u003c/div>\n\n\u003cdiv class=\"stats\">\u003cdiv>\u003cb>5 min\u003c/b>\u003cspan>per ogni pitch\u003c/span>\u003c/div>\u003cdiv>\u003cb>25–40\u003c/b>\u003cspan>anni, tutti benvenuti\u003c/span>\u003c/div>\u003cdiv>\u003cb>3 città\u003c/b>\u003cspan>e altre in arrivo\u003c/span>\u003c/div>\u003cdiv>\u003cb>100%\u003c/b>\u003cspan>dal vivo, zero app\u003c/span>\u003c/div>\u003c/div>\n\n\u003csection id=\"eventi\">\u003cdiv class=\"wrap\">\u003cdiv class=\"k\">Prossime date\u003c/div>\u003ch2>Trova la tua serata\u003c/h2>\u003cp class=\"lead\">Scegli la città, prendi il biglietto e ricevi il QR code via email.\u003c/p>\n\u003cdiv class=\"tiles\">\n\u003cdiv class=\"tile ph\" data-l=\"FOTO – Milano\">\u003cspan class=\"badge\">Ultimi posti\u003c/span>\u003cdiv class=\"in\">\u003cdiv class=\"dt\">21 NOV\u003c/div>\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"tile ph\" data-l=\"FOTO – Torino\">\u003cspan class=\"badge\">Disponibile\u003c/span>\u003cdiv class=\"in\">\u003cdiv class=\"dt\">05 DIC\u003c/div>\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"tile ph\" data-l=\"FOTO – Roma\">\u003cspan class=\"badge\">Sold out\u003c/span>\u003cdiv class=\"in\">\u003cdiv class=\"dt\">18 GEN\u003c/div>\u003ch3>Roma\u003c/h3>\u003cp>Sabato · 21:00 · Lista d'attesa aperta\u003c/p>\u003ca class=\"btn sm o\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"how\" id=\"format\">\u003cdiv class=\"wrap split\">\n\u003cdiv class=\"ph\" data-l=\"FOTO – pitch sul palco\">\u003c/div>\n\u003cdiv>\u003cdiv class=\"k\">Il format\u003c/div>\u003ch2>Come funziona\u003c/h2>\u003cp class=\"lead\">Tre passi, zero imbarazzo.\u003c/p>\n\u003cdiv class=\"steps\">\u003cdiv>\u003cb>01\u003c/b>\u003cspan>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la data nella tua città. Più biglietti in un solo acquisto.\u003c/p>\u003c/span>\u003c/div>\n\u003cdiv>\u003cb>02\u003c/b>\u003cspan>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti presentare: cinque minuti, anche con un PDF.\u003c/p>\u003c/span>\u003c/div>\n\u003cdiv>\u003cb>03\u003c/b>\u003cspan>\u003ch3>Conosci le persone\u003c/h3>\u003cp>Si chiacchiera, si brinda, e le connessioni continuano dopo la serata.\u003c/p>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\u003cdiv class=\"k\">Le serate\u003c/div>\u003ch2>Facce vere, serate vere\u003c/h2>\u003cp class=\"lead\">Un archivio fotografico che racconta l'atmosfera meglio di qualsiasi testo.\u003c/p>\n\u003cdiv class=\"mosaic\">\u003cdiv class=\"ph\" data-l=\"FOTO – pubblico che ride\">\u003c/div>\u003cdiv class=\"ph\" data-l=\"FOTO – brindisi\">\u003c/div>\u003cdiv class=\"ph\" data-l=\"FOTO – dettaglio\">\u003c/div>\u003cdiv class=\"ph\" data-l=\"FOTO – amici sul palco\">\u003c/div>\u003cdiv class=\"ph\" data-l=\"FOTO – dopo serata\">\u003c/div>\u003c/div>\n\u003cdiv class=\"who\">\u003cdiv>\u003cb>Single 25–40\u003c/b>\u003cspan>Gente nuova, senza app\u003c/span>\u003c/div>\u003cdiv>\u003cb>Amici di single\u003c/b>\u003cspan>Racconta quanto è bravo\u003c/span>\u003c/div>\u003cdiv>\u003cb>Introversi\u003c/b>\u003cspan>C'è chi parla per voi\u003c/span>\u003c/div>\u003cdiv>\u003cb>LGBTQ+\u003c/b>\u003cspan>Spazio inclusivo\u003c/span>\u003c/div>\u003c/div>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"apply ph\" id=\"candidati\" data-l=\"FOTO – sfondo scuro, mani che si alzano\">\u003cdiv class=\"wrap\">\n\u003cdiv>\u003cdiv class=\"k\">Candidature\u003c/div>\u003ch2>Hai un amico da presentare?\u003c/h2>\u003cp class=\"lead\" style=\"margin:0\">Compila il modulo: ti ricontattiamo per fissare la data e preparare il pitch.\u003c/p>\u003c/div>\n\u003cform onsubmit=\"return false\">\u003cdiv class=\"two\">\u003cinput placeholder=\"Il tuo nome\">\u003cinput placeholder=\"Email\">\u003c/div>\u003cinput placeholder=\"Nome del tuo amico\">\u003ctextarea placeholder=\"Perché dovremmo conoscerlo?\">\u003c/textarea>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\u003cbutton class=\"btn\">Invia candidatura\u003c/button>\u003c/form>\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\u003cdiv class=\"k\">Dicono di noi\u003c/div>\u003cbr>\u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"faq\" style=\"padding-top:0\">\u003cdiv class=\"wrap\" style=\"max-width:780px\">\u003cdiv class=\"k\">FAQ\u003c/div>\u003ch2>Domande frequenti\u003c/h2>\u003cbr>\n\u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire anche da solo.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Posso acquistare più biglietti insieme?\u003c/summary>\u003cp>Sì, ognuno con il proprio QR code.\u003c/p>\u003c/details>\n\u003c/div>\u003c/section>\n\u003cfooter>\u003cdiv class=\"wrap\">\u003cspan class=\"logo\">Pitcha \u003cb>l'Amico\u003c/b>\u003c/span>\u003cdiv>\u003ca href=\"#\">Termini\u003c/a>\u003ca href=\"#\">Privacy\u003c/a>\u003ca href=\"#\">Cookie\u003c/a>\u003ca href=\"#\">Contatti\u003c/a>\u003c/div>\u003c/div>\u003c/footer>\n\u003cdiv class=\"spec\">\u003cdiv class=\"wrap\">\u003cdiv style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#777\">Palette e tipografia\u003c/div>\u003cp style=\"font-family:'Archivo Black';font-size:34px;text-transform:uppercase\">Archivo Black \u003cspan style=\"font-family:Inter;font-size:14px;text-transform:none;color:#666\">titoli · Inter testi. Il colore lo mettono le foto.\u003c/span>\u003c/p>\n\u003cdiv class=\"sw\">\u003cdiv>\u003ci style=\"background:#0c0c0c\">\u003c/i>Nero #0C0C0C\u003c/div>\u003cdiv>\u003ci style=\"background:#fff\">\u003c/i>Bianco #FFFFFF\u003c/div>\u003cdiv>\u003ci style=\"background:#E81F32\">\u003c/i>Rosso brand #E81F32\u003c/div>\u003cdiv>\u003ci style=\"background:#bdbdbd\">\u003c/i>Grigio #BDBDBD\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003c/body>\u003c/html>\n"},{"title":"Proposta 8 Fumetto","html":"\u003c!doctype html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pitcha l'Amico – Proposta 8 Fumetto\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--red:#E81F32;--cream:#FCEFB4;--paper:#FFFBEA;--blue:#3FA9F5;--yel:#FFD93D;--pink:#FF8FB1;--ink:#111}\n*{box-sizing:border-box;margin:0}\nbody{font-family:'Comic Neue',sans-serif;font-weight:700;background:var(--paper);color:var(--ink);line-height:1.45;overflow-x:hidden;font-size:17px;\n background-image:radial-gradient(rgba(232,31,50,.12) 1.5px,transparent 1.8px);background-size:14px 14px}\na{color:inherit;text-decoration:none}\n.wrap{max-width:1100px;margin:0 auto;padding:0 22px}\nh1,h2,h3,.bg{font-family:'Bangers',cursive;font-weight:400;letter-spacing:.04em;line-height:1}\n.note{background:var(--ink);color:var(--yel);font-size:12px;text-align:center;padding:6px}\nnav{background:var(--yel);border-bottom:5px solid var(--ink)}\nnav .wrap{display:flex;justify-content:space-between;align-items:center;height:70px}\n.logo{font-family:'Bangers';font-size:32px;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;transform:rotate(-2deg);letter-spacing: eam);min-height:208px;padding:20px;display:flex;align-items:center;justify-content:center}\n.face{width:112px;height:112px;border-radius:50%;border:5px solid var(--ink);background:#FFD7B5;position:relative;flex:none}\n.face::before,.face::after{content:\"\";position:absolute;top:42px;width:12px;height:12px;border-radius:50%;background:var(--ink)}\n.face::before{left:28px}.face::after{right:28px}\n.face i{position:absolute;left:50%;bottom:22px;width:44px;height:20px;transform:translateX(-50%);border-bottom:5px solid var(--ink);border-radius:0 0 50px 50px}\n.face.o i{height:24px;width:22px;border:5px solid var(--ink);border-radius:50%;bottom:16px}\n.face u{position:absolute;top:-10px;left:8px;right:8px;height:34px;border-radius:50px 50px 0 0;background:#5a3418;border:5px solid var(--ink)}\n.bub{background:#fff;border:4px solid var(--ink);border-radius:50% / 60%;padding:14px 18px;max-width:200px;font-size:15px;line-height:1.2;position:relative;text-align:center}\n.bub::after{content:\"\";position:absolute;bottom:-18px;left:30px;border:12px solid transparent;border-top:18px solid var(--ink)}\n.bub.r::after{left:auto;right:30px}\n\nsection{padding:70px 0}\nh2{font-size:clamp(40px,6vw,72px);color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);text-transform:uppercase;margin-bottom:10px}\n.lead{max-width:560px;margin-bottom:34px;font-size:19px}\n\n.evs{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}\n.ev{background:#fff;padding:0}\n.ev .top{background:var(--yel);border-bottom:5px solid var(--ink);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:relative}\n.ev .dt{font-family:'Bangers';font-size:46px;line-height:1;color:var(--red);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}\n.ev .body{padding:18px}.ev h3{font-size:38px;margin-bottom:4px}.ev p{font-size:15px;margin-bottom:14px}\n.ev:nth-child(1){transform:rotate(-1.2deg)}.ev:nth-child(2){transform:rota e minuti sul palco, un amico che parla di te e una sala piena di gente nuova. Niente app!\u003c/p>\u003cdiv class=\"row\" style=\"position:relative\">\u003ca class=\"btn y\" href=\"#eventi\">Scopri gli eventi\u003c/a>\u003ca class=\"btn\" href=\"#candidati\">Presenta un amico\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"panel p2\">\u003cdiv class=\"ht\">\u003c/div>\u003cdiv class=\"bub\" style=\"margin-right:10px;z-index:1\">\"È l'unico che ti riporta l'ombrello!\"\u003c/div>\u003cdiv class=\"face\" style=\"z-index:1\">\u003cu>\u003c/u>\u003ci>\u003c/i>\u003c/div>\u003c/div>\n\u003cdiv class=\"panel p3\">\u003cdiv class=\"ht\">\u003c/div>\u003cdiv class=\"face o\" style=\"z-index:1;background:#E9B98A\">\u003cu style=\"background:#111\">\u003c/u>\u003ci>\u003c/i>\u003c/div>\u003cdiv class=\"bub r\" style=\"margin-left:14px;z-index:1\">...e fa anche una carbonara pazzesca!\u003c/div>\u003cdiv class=\"burst\" style=\"right:-10px;bottom:-12px;transform:rotate(10deg);width:110px;height:100px;font-size:20px\">5 MIN!\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\u003c/header>\n\n\u003csection id=\"eventi\" style=\"padding-top:20px\">\u003cdiv class=\"wrap\">\u003ch2>Prossime serate\u003c/h2>\u003cp class=\"lead\">Scegli la città, prendi il biglietto e ricevi il QR code via email. Pow!\u003c/p>\n\u003cdiv class=\"evs\">\n\u003cdiv class=\"panel ev\">\u003cdiv class=\"top\">\u003cspan class=\"dt\">21 NOV\u003c/span>\u003cspan class=\"sx\">ULTIMI POSTI!\u003c/span>\u003c/div>\u003cdiv class=\"body\">\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"panel ev\">\u003cdiv class=\"top\">\u003cspan class=\"dt\">05 DIC\u003c/span>\u003cspan class=\"sx b\">DISPONIBILE\u003c/span>\u003c/div>\u003cdiv class=\"body\">\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"panel ev\">\u003cdiv class=\"top\">\u003cspan class=\"dt\">18 GEN\u003c/span>\u003cspan class=\"sx g\">SOLD OUT\u003c/span>\u003c/div>\u003cdiv class=\"body\">\u003ch3>Roma\u003c/h3>\u003cp>Sabato · 21:00 · Lista d'attesa aperta\u003c/p>\u003ca class=\"btn sm y\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"format\" style=\"background:#fff;border-block:5px solid var(--ink)\">\u003cdiv class=\"wrap\">\u003ch2>Come funziona\u003c/h2>\u003cp class=\"lead\">Una storia in tre vignette.\u003c/p>\n\u003cdiv class=\"strip\">\n\u003cdiv class=\"panel sp\">\u003cdiv class=\"ht\">\u003c/div>\u003cspan class=\"cap\" style=\"position:relative\">VIGNETTA 1\u003c/span>\u003cdiv style=\"position:relative\">\u003cdiv class=\"n\">1\u003c/div>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la data nella tua città. Più biglietti in un solo acquisto, se vieni in compagnia.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"panel sp\">\u003cdiv class=\"ht\">\u003c/div>\u003cspan class=\"cap\" style=\"position:relative\">VIGNETTA 2\u003c/span>\u003cdiv style=\"position:relative\">\u003cdiv class=\"n\">2\u003c/div>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti presentare: cinque minuti, anche con un PDF di slide.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"panel sp\">\u003cdiv class=\"ht\">\u003c/div>\u003cspan class=\"cap\" style=\"position:relative\">VIGNETTA 3\u003c/span>\u003cdiv style=\"position:relative\">\u003cdiv class=\"n\">3\u003c/div>\u003ch3>Conosci gente\u003c/h3>\u003cp>Si chiacchiera, si brinda, e le connessioni continuano anche dopo la serata.\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\u003ch2>Per chi è\u003c/h2>\u003cp class=\"lead\">Un posto informale dove stare bene.\u003c/p>\n\u003cdiv class=\"who\">\u003cdiv class=\"bub\">Single tra i 25 e i 40!\u003c/div>\u003cdiv class=\"bub\">Amici di single!\u003c/div>\u003cdiv class=\"bub\">Introversi? Benvenuti!\u003c/div>\u003cdiv class=\"bub\">Comunità LGBTQ+ inclusa!\u003c/div>\u003c/div>\u003cbr>\u003cbr>\n\u003c/div>\u003c/section>\n\n\u003csection class=\"apply\" id=\"candidati\">\u003cdiv class=\"wrap\">\u003cdiv>\u003ch2>Hai un amico da presentare?\u003c/h2>\u003cp class=\"lead\" style=\"margin:0;color:#fff\">Compila il modulo: ti ricontattiamo per fissare la data e preparare il pitch.\u003c/p>\u003c/div>\n\u003cform onsubmit=\"return false\">\u003cdiv class=\"two\">\u003cinput placeholder=\"Il tuo nome\">\u003cinput placeholder=\"Email\">\u003c/div>\u003cinput placeholder=\"Nome del tuo amico\">\u003ctextarea placeholder=\"Perché dobbiamo conoscerlo?\">\u003c/textarea>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\u003cbutton class=\"btn\">Invia candidatura\u003c/button>\u003c/form>\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\u003ch2>Sui giornali\u003c/h2>\u003cbr>\u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"faq\" style=\"padding-top:0\">\u003cdiv class=\"wrap\" style=\"max-width:780px\">\u003ch2>Domande frequenti\u003c/h2>\u003cbr>\n\u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire anche da solo.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Posso acquistare più biglietti insieme?\u003c/summary>\u003cp>Sì, ognuno con il proprio QR code.\u003c/p>\u003c/details>\n adding:38px;text-align:left;animation:up .4s ease}\n.result.show{display:block}@keyframes up{from{opacity:0;transform:translateY(16px)}}\n.result .tag{display:inline-block;background:var(--coral);color:var(--ink);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:14px}\n.result h2{font-size:clamp(28px,4vw,44px);margin-bottom:10px}.result p{color:#d8cdc9;max-width:560px;margin-bottom:22px}\n.result .row{display:flex;gap:12px;flex-wrap:wrap}.result .btn.o{color:#fff;border-color:#fff}.result .btn.o:hover{background:#fff;color:var(--ink)}\n.reset{margin-top:18px;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}\n\nsection{padding:84px 0}\n.dark{background:var(--ink);color:#fff}\n.k{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:12px}\nh2.t{font-size:clamp(34px,5vw,60px);margin-bottom:12px}\n.lead{color:var(--mute);font-size:18px;max-width:540px;margin-bottom:38px}.dark .lead{color:#bdb1ad}\n\n.evs{display:grid;gap:12px}\n.ev{display:grid;grid-template-columns:90px 1fr auto;gap:22px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:16px 22px;transition:.18s}\n.ev:hover{transform:translateX(8px);box-shadow:-6px 6px 0 var(--ink)}\n.ev .d{background:var(--cream);border-radius:14px;text-align:center;padding:8px 0}.ev .d b{display:block;font-size:34px;line-height:1;letter-spacing:-.04em}.ev .d span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}\n.ev h3{font-size:26px}.ev p{font-size:14px;color:var(--mute)}.ev small{font-weight:700;font-size:12px;color:var(--red);display:block}\n\n.how{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}\n.hw{border:1px solid #4a3d3a;border-radius:22px;padding:28px}.hw b{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--coral);color:var(--ink);margin-bottom:34px}\n.hw h3{font-size:25px;margin-bottom:8px}.hw p{font-size:15px;color:#bdb1ad}\n\n.apply .box{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;background:var(--coral);border-radius:34px;padding:50px}\nform{background:#fff;border-radius:22px;padding:24px;display:grid;gap:12px}\ninput,textarea{font:inherit;padding:13px 16px;border-radius:12px;border:2px solid #eee;background:#faf6f2;width:100%;outline:0}input:focus,textarea:focus{border-color:var(--ink);background:#fff}textarea{min-height:82px}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chk{font-size:12px;color:var(--mute);display:flex;gap:8px}.chk input{width:auto}\n.press{display:flex;flex-wrap:wrap;gap:12px 40px;font-weight:700;font-size:22px;letter-spacing:-.03em;color:#b2a49f}\ndetails{border-bottom:2px solid var(--ink);padding:20px 0}summary{cursor:pointer;font-weight:700;font-size:19px;list-style:none;display:flex;justify-content:space-between}summary::after{content:\"+\";color:var(--red);font-size:24px}details[open] summary::after{content:\"–\"}details p{margin-top:8px;color:var(--mute)}\nfooter{border-top:2px solid var(--ink);padding:40px 0;font-size:14px;color:var(--mute)}footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}footer a{margin-left:20px}\n.spec{background:#fff;padding:50px 0;border-top:2px solid var(--ink)}.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.sw div{width:110px;font-size:11px;font-weight:700}.sw i{display:block;height:50px;border-radius:14px;border:1px solid #ddd;margin-bottom:5px}\n\n@media(max-width:860px){.menu a:not(.btn){display:none}.opts,.how,.apply .box{grid-template-columns:1fr}.opt{min-height:0}.ev{grid-template-columns:70px 1fr}.ev .btn{grid-column:1/-1;text-align:center}.two{grid-template-columns:1fr}.apply .box{padding:28px}section{padding:60px 0}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"note\">Proposta 9 – Quiz interattivo · clicca una delle tre risposte nella hero · testi ed eventi segnaposto\u003c/div>\n\u003cnav>\u003cdiv class=\"wrap\">\u003ca class=\"logo\" href=\"#\">pitcha \u003cb>l'amico\u003c/b>\u003c/a>\n\u003cdiv class=\"menu\">\u003ca href=\"#format\">Format\u003c/a>\u003ca href=\"#eventi\">Eventi\u003c/a>\u003ca href=\"#candidati\">Candidati\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca class=\"btn sm\" href=\"#eventi\">Biglietti\u003c/a>\u003c/div>\u003c/div>\u003c/nav>\n\n\u003cheader class=\"quiz\">\u003cdiv class=\"wrap\">\n\u003cdiv class=\"step\">Domanda 1 di 1\u003c/div>\n\u003ch1>Tu come ci arrivi alla serata?\u003c/h1>\n\u003cp class=\"sub\">Un tocco e ti portiamo nel punto giusto del sito.\u003c/p>\n\u003cdiv class=\"opts\" id=\"opts\">\n\u003cbutton class=\"opt\" data-k=\"single\">\u003cspan class=\"em\">🙋\u003c/span>\u003cb>Sono single e voglio conoscere gente\u003c/b>\u003cspan>Vengo per me\u003c/span>\u003c/button>\n\u003cbutton class=\"opt\" data-k=\"amico\">\u003cspan class=\"em\">🫶\u003c/span>\u003cb>Ho un amico single fantastico\u003c/b>\u003cspan>Lo voglio presentare\u003c/span>\u003c/button>\n\u003cbutton class=\"opt\" data-k=\"curioso\">\u003cspan class=\"em\">🤔\u003c/span>\u003cb>Non so bene come funziona\u003c/b>\u003cspan>Spiegatemi il format\u003c/span>\u003c/button>\n\u003c/div>\n\u003cdiv class=\"result\" id=\"res\" aria-live=\"polite\">\n\u003cspan class=\"tag\" id=\"rt\">\u003c/span>\u003ch2 id=\"rh\">\u003c/h2>\u003cp id=\"rp\">\u003c/p>\n\u003cdiv class=\"row\" id=\"rb\">\u003c/div>\u003c/div>\n\u003cbutton class=\"reset\" id=\"reset\" style=\"display:none\">Ricomincia\u003c/button>\n\u003c/div>\u003c/header>\n\n\u003csection id=\"eventi\" style=\"padding-top:20px\">\u003cdiv class=\"wrap\">\u003cdiv class=\"k\">Prossime date\u003c/div>\u003ch2 class=\"t\">Trova la tua serata\u003c/h2>\u003cp class=\"lead\">Scegli la città, prendi il biglietto e ricevi il QR code via email.\u003c/p>\n\u003cdiv class=\"evs\">\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">\u003cb>21\u003c/b>\u003cspan>Nov\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Ultimi posti\u003c/small>\u003ch3>Milano\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003c/div>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">\u003cb>05\u003c/b>\u003cspan>Dic\u003c/span>\u003c/div>\u003cdiv>\u003csmall style=\"color:var(--mute)\">Disponibile\u003c/small>\u003ch3>Torino\u003c/h3>\u003cp>Venerdì · 20:30 · Locale da definire\u003c/p>\u003c/div>\u003ca class=\"btn sm\" href=\"#\">Acquista\u003c/a>\u003c/div>\n\u003cdiv class=\"ev\">\u003cdiv class=\"d\">\u003cb>18\u003c/b>\u003cspan>Gen\u003c/span>\u003c/div>\u003cdiv>\u003csmall style=\"color:var(--mute)\">Sold out\u003c/small>\u003ch3>Roma\u003c/h3>\u003cp>Sabato · 21:00 · Lista d'attesa aperta\u003c/p>\u003c/div>\u003ca class=\"btn sm o\" href=\"#\">Lista d'attesa\u003c/a>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"dark\" id=\"format\">\u003cdiv class=\"wrap\">\u003cdiv class=\"k\">Il format\u003c/div>\u003ch2 class=\"t\">Come funziona\u003c/h2>\u003cp class=\"lead\">Tre passi, zero imbarazzo.\u003c/p>\n\u003cdiv class=\"how\">\u003cdiv class=\"hw\">\u003cb>1\u003c/b>\u003ch3>Scegli l'evento\u003c/h3>\u003cp>Trova la data nella tua città. Più biglietti in un solo acquisto, se vieni in compagnia.\u003c/p>\u003c/div>\n\u003cdiv class=\"hw\">\u003cb>2\u003c/b>\u003ch3>Prepara il pitch\u003c/h3>\u003cp>Pitcha un amico o fatti presentare: cinque minuti, anche con un PDF di slide.\u003c/p>\u003c/div>\n\u003cdiv class=\"hw\">\u003cb>3\u003c/b>\u003ch3>Conosci le persone\u003c/h3>\u003cp>Si chiacchiera, si brinda, e le connessioni continuano anche dopo la serata.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection>\u003cdiv class=\"wrap\">\u003cdiv class=\"k\">Per chi è\u003c/div>\u003ch2 class=\"t\">Un posto dove stare bene\u003c/h2>\u003cp class=\"lead\">Single 25–40, amici di single, introversi e comunità LGBTQ+: un ambiente informale e accogliente.\u003c/p>\u003c/div>\u003c/section>\n\n\u003csection class=\"apply\" id=\"candidati\" style=\"padding-top:0\">\u003cdiv class=\"wrap\">\u003cdiv class=\"box\">\n\u003cdiv>\u003cdiv class=\"k\" style=\"color:var(--ink)\">Candidature\u003c/div>\u003ch2 class=\"t\">Hai un amico da presentare?\u003c/h2>\u003cp style=\"max-width:420px\">Compila il modulo: ti ricontattiamo per fissare la data e preparare il pitch.\u003c/p>\u003c/div>\n\u003cform onsubmit=\"return false\">\u003cdiv class=\"two\">\u003cinput placeholder=\"Il tuo nome\">\u003cinput placeholder=\"Email\">\u003c/div>\u003cinput placeholder=\"Nome del tuo amico\">\u003ctextarea placeholder=\"Perché dovremmo conoscerlo?\">\u003c/textarea>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"> Il mio amico è d'accordo e accetto l'informativa privacy.\u003c/label>\u003cbutton class=\"btn\">Invia candidatura\u003c/button>\u003c/form>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\u003cdiv class=\"k\">Dicono di noi\u003c/div>\u003cbr>\u003cdiv class=\"press\">\u003cspan>la Repubblica\u003c/span>\u003cspan>Il Post\u003c/span>\u003cspan>Famiglia Cristiana\u003c/span>\u003cspan>MilanoToday\u003c/span>\u003cspan>Radio Deejay\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"faq\" style=\"padding-top:0\">\u003cdiv class=\"wrap\" style=\"max-width:780px\">\u003cdiv class=\"k\">FAQ\u003c/div>\u003ch2 class=\"t\">Domande frequenti\u003c/h2>\u003cbr>\n\u003cdetails open>\u003csummary>Devo venire con un amico?\u003c/summary>\u003cp>No, puoi venire anche da solo.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Dress code?\u003c/summary>\u003cp>Smart casual.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Come preparo il pitch?\u003c/summary>\u003cp>Cinque minuti a voce, anche con un PDF di massimo 10 pagine.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Posso acquistare più biglietti insieme?\u003c/summary>\u003cp>Sì, ognuno con il proprio QR code.\u003c/p>\u003c/details>\n\u003c/div>\u003c/section>\n\u003cfooter>\u003cdiv class=\"wrap\">\u003cspan class=\"logo\">pitcha \u003cb>l'amico\u003c/b>\u003c/span>\u003cdiv>\u003ca href=\"#\">Termini\u003c/a>\u003ca href=\"#\">Privacy\u003c/a>\u003ca href=\"#\">Cookie\u003c/a>\u003ca href=\"#\">Contatti\u003c/a>\u003c/div>\u003c/div>\u003c/footer>\n\u003cdiv class=\"spec\">\u003cdiv class=\"wrap\">\u003cp style=\"font-weight:700;font-size:34px;letter-spacing:-.04em\">Space Grotesk \u003cspan style=\"font-size:15px;font-weight:500;color:var(--mute)\">per titoli e testi\u003c/span>\u003c/p>\n\u003cdiv class=\"sw\">\u003cdiv>\u003ci style=\"background:#FFF6EC\">\u003c/i>Fondo #FFF6EC\u003c/div>\u003cdiv>\u003ci style=\"background:#1c1414\">\u003c/i>Inchiostro #1C1414\u003c/div>\u003cdiv>\u003ci style=\"background:#E81F32\">\u003c/i>Rosso brand #E81F32\u003c/div>\u003cdiv>\u003ci style=\"background:#FF5A5F\">\u003c/i>Corallo #FF5A5F\u003c/div>\u003cdiv>\u003ci style=\"background:#FCEFB4\">\u003c/i>Crema #FCEFB4\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cscript>\nconst C={\n single:{t:\"Per te\",h:\"Allora trova la tua serata.\",p:\"Scegli una data nella tua città, prendi il biglietto e, se te la senti, fatti pitchare da un amico direttamente sul palco.\",b:[[\"Vedi gli eventi\",\"#eventi\",\"\"],[\"Come funziona\",\"#format\",\"o\"]]},\n amico:{t:\"Per chi presenta\",h:\"Racconta al mondo com'è fatto.\",p:\"Compila il modulo di candidatura: ti ricontattiamo per fissare la data e preparare insieme un pitch da cinque minuti.\",b:[[\"Presenta il tuo amico\",\"#candidati\",\"\"],[\"Vedi gli eventi\",\"#eventi\",\"o\"]]},\n curioso:{t:\"Per chi è curioso\",h:\"Tre passi e sei dentro.\",p:\"Scegli l'evento, prepara un pitch di cinque minuti e conosci le persone dal vivo. Niente app, niente imbarazzo.\",b:[[\"Scopri il format\",\"#format\",\"\"],[\"Leggi le FAQ\",\"#faq\",\"o\"]]}\n};\nconst opts=document.querySelectorAll('.opt'),res=document.getElementById('res'),reset=document.getElementById('reset');\nopts.forEach(o=>o.addEventListener('click',()=>{\n const c=C[o.dataset.k];opts.forEach(x=>x.classList.remove('on'));o.classList.add('on');\n rt.textContent=c.t;rh.textContent=c.h;rp.textContent=c.p;\n rb.innerHTML=c.b.map(([l,h,k])=>`\u003ca class=\"btn ${k}\" href=\"${h}\">${l}\u003c/a>`).join('');\n res.classList.add('show');reset.style.display='inline';\n}));\nreset.addEventListener('click',()=>{opts.forEach(x=>x.classList.remove('on'));res.classList.remove('show');reset.style.display='none'});\n\u003c/script>\n\u003c/body>\u003c/html>\n"}];
const sel = document.getElementById('sel'), frame = document.getElementById('frame'), count = document.getElementById('count');
ITEMS.forEach((it, i) => sel.add(new Option(it.title, i)));
function show(i) {
  i = Math.max(0, Math.min(ITEMS.length - 1, i));
  sel.value = i;
  frame.srcdoc = ITEMS[i].html;
  count.textContent = (i + 1) + ' / ' + ITEMS.length;
  history.replaceState(null, '', '#' + (i + 1));
}
sel.onchange = () => show(+sel.value);
document.getElementById('prev').onclick = () => show(+sel.value - 1);
document.getElementById('next').onclick = () => show(+sel.value + 1);
show((parseInt(location.hash.slice(1)) || 1) - 1);
</script>
